backend:
  name: github
  repo: rahulabhishek5/ask4trainings
  branch: main
  base_url: https://ask4trainings.pages.dev
  auth_endpoint: /api/auth

publish_mode: editorial_workflow
local_backend: false # Set to true for local testing with 'npm run cms:proxy'.
logo_url: /logo.svg

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: global_settings
    label: 🌐 Global Settings & Footer
    editor:
      preview: false
    files:
      - label: 📢 Announcement Banner
        name: announcement_banner
        file: src/data/settings.json
        format: json
        fields:
          - label: 📍 Live Location
            name: livePath
            widget: string
            default: Sitewide — Top Banner Bar (all pages)
            hint: READ-ONLY context marker. Do not change. Tells you where this content
              appears on the live website.
          - label: 📢 Announcement Banner Settings
            name: announcement
            widget: object
            hint: The dismissible banner strip shown at the very top of every page.
            fields:
              - label: Enable Banner
                name: enabled
                widget: boolean
                default: false
                hint: Toggle ON to display the banner to all visitors. Toggle OFF to hide it
                  entirely.
              - label: Banner Text
                name: text
                widget: string
                hint: 'Example: ''New Guidewire PolicyCenter 10.x batch starting this Monday —
                  limited classroom & online seats available.'''
              - label: CTA Button Label
                name: ctaLabel
                widget: string
                hint: 'Example: ''Enquire Now'' or ''Reserve a Seat'''
              - label: CTA Button URL
                name: ctaUrl
                widget: string
                hint: 'Example: ''/student-registration/'' — use a relative path starting with
                  /'
          - label: ☎️ Primary Contact Details
            name: phonePrimary
            widget: string
            hint: 'Example: ''+91 8099949888'' — Primary phone shown in header and footer
              contact sections.'
          - label: ☎️ Secondary Contact Number
            name: phoneSecondary
            widget: string
            hint: 'Example: ''+91 9951609609'' — Secondary helpline for call-only
              enquiries.'
          - label: 📱 WhatsApp Number (Digits Only)
            name: whatsappNumber
            widget: string
            hint: 'Example: ''918099949888'' — Country code + 10 digits, no spaces, dashes,
              or ''+'' symbol. Used to construct wa.me/ chat links.'
          - label: 📧 Support Email Address
            name: email
            widget: string
            hint: 'Example: ''info@ask4trainings.com'' — Public-facing contact email for
              student enquiries.'
          - label: 🔗 Social Media Links
            name: socials
            widget: object
            hint: Full URLs to all official Ask4Trainings social profiles. Leave blank to
              hide that platform icon in the footer.
            fields:
              - label: LinkedIn URL
                name: linkedin
                widget: string
                required: false
                hint: 'Example: ''https://linkedin.com/company/ask4trainings'''
              - label: YouTube Channel URL
                name: youtube
                widget: string
                required: false
                hint: 'Example: ''https://www.youtube.com/@ask4trainings'''
              - label: Instagram URL
                name: instagram
                widget: string
                required: false
                hint: 'Example: ''https://www.instagram.com/ask4trainings'''
              - label: Facebook Page URL
                name: facebook
                widget: string
                required: false
                hint: 'Example: ''https://facebook.com/ask4trainings'''
              - label: X (Twitter) URL
                name: twitter
                widget: string
                required: false
                hint: 'Example: ''https://x.com/ask4trainings'''
          - label: 🦶 Footer Configuration
            name: footer
            widget: object
            hint: Manages all 4 columns of the website footer, the SEO tag cloud, copyright,
              and about blurb.
            fields:
              - label: Footer Link Columns (Columns 1–3)
                name: columns
                widget: list
                hint: The first 3 footer columns. Each column has a heading and a list of links.
                  Column 4 (Office Info) is configured separately below.
                summary: 'Column: {{fields.title}}'
                fields:
                  - label: Column Heading
                    name: title
                    widget: string
                    hint: 'Example: ''Popular Courses'' or ''Trending & Enterprise Technologies'''
                  - label: Links in This Column
                    name: links
                    widget: list
                    hint: Add, remove, or reorder links in this footer column.
                    summary: '{{fields.label}} → {{fields.url}}'
                    fields:
                      - label: Link Label
                        name: label
                        widget: string
                        hint: 'Example: ''Guidewire Courses'' or ''Privacy Policy'''
                      - label: URL Path
                        name: url
                        widget: string
                        hint: 'Example: ''/guidewire-courses/'' — must start with / for internal links.
                          Use https:// for external links.'
              - label: 'Column 4: Office Information & Location'
                name: office
                widget: object
                hint: The 4th footer column showing physical office details, contact numbers,
                  hours, and map link.
                fields:
                  - label: Column Heading
                    name: title
                    widget: string
                    default: Office Information & Location
                    hint: 'Example: ''Office Information & Location'''
                  - label: Institute Full Name
                    name: instituteName
                    widget: string
                    hint: 'Example: ''Ask4Trainings IT Training Institute'''
                  - label: Address
                    name: address
                    widget: text
                    hint: 'Example: ''Flat No. 403, 4th Floor, Naga Sai Nivas, Prime Hospital Lane,
                      Ameerpet, Hyderabad, Telangana 500016.'''
                  - label: Primary WhatsApp Hotline (Digits Only)
                    name: whatsappHotline
                    widget: string
                    hint: 'Example: ''918099949888'' — Country code + 10 digits, no spaces or
                      symbols. Used for wa.me/ links.'
                  - label: Calling Numbers
                    name: callingNumbers
                    widget: list
                    hint: All telephone numbers shown in the footer. Each entry has a label and a
                      number.
                    summary: '{{fields.label}}: {{fields.number}}'
                    fields:
                      - label: Number Label
                        name: label
                        widget: string
                        hint: 'Example: ''Primary / WhatsApp'' or ''Secondary / Calls'''
                      - label: Phone Number
                        name: number
                        widget: string
                        hint: 'Example: ''+91 8099949888'' — Include country code with + for tel: links
                          to work correctly.'
                  - label: Support Email
                    name: supportEmail
                    widget: string
                    hint: 'Example: ''info@ask4trainings.com'''
                  - label: Branch Timings
                    name: branchTimings
                    widget: string
                    hint: 'Example: ''Mon–Sat: 7:00 AM – 9:00 PM IST · Sunday: 9:00 AM – 6:00 PM
                      IST'''
                  - label: Google Maps URL (for link)
                    name: googleMapsEmbedUrl
                    widget: string
                    hint: 'Example: ''https://maps.google.com/?q=Ask4Trainings+Ameerpet'' — Paste
                      the Google Maps share URL.'
              - label: SEO Keyword Tag Cloud
                name: seoTagCloud
                widget: list
                hint: Keyword links shown in the footer's SEO authority section. Include
                  relevant long-tail keywords for search ranking.
                summary: '{{fields.label}}'
                fields:
                  - label: Tag Label
                    name: label
                    widget: string
                    hint: 'Example: ''Best IT Institute in Hyderabad'' or ''Guidewire Training
                      Ameerpet'''
                  - label: Target URL
                    name: url
                    widget: string
                    hint: 'Example: ''/'' or ''/guidewire-courses/'''
              - label: Copyright Text
                name: copyright
                widget: string
                hint: 'Example: ''© 2012 Ask4Trainings. All rights reserved.'' — Appears in the
                  footer bottom bar.'
              - label: Footer About Blurb
                name: aboutBlurb
                widget: text
                hint: '2–3 sentence paragraph describing Ask4Trainings shown in the footer''s
                  SEO section.'
      - label: 🧭 Header & Mega Menu Navigation
        name: navigation
        file: src/data/navigation.json
        format: json
        fields:
          - label: 📍 Live Location
            name: livePath
            widget: string
            default: Sitewide — Top Navigation Bar, Mega Menu, and header contact strip
            hint: READ-ONLY context marker. Tells you where this content appears on the live
              website.
          - label: 📞 Header Contact Strip
            name: topBar
            widget: object
            hint: The contact info row shown at the very top of every page (above the main
              nav).
            fields:
              - label: Primary Phone (Display)
                name: phonePrimary
                widget: string
                hint: 'Example: ''+91 8099949888'' — Displayed with a call icon in the top bar.'
              - label: Secondary Phone (Display)
                name: phoneSecondary
                widget: string
                required: false
                hint: 'Example: ''+91 9951609609'' — Optional secondary number.'
              - label: Contact Email
                name: email
                widget: string
                hint: 'Example: ''info@ask4trainings.com'''
              - label: Google Review URL
                name: reviewUrl
                widget: string
                required: false
                hint: 'Example: ''https://g.page/r/ask4trainings/review'' — Paste the Google
                  Business review link.'
              - label: Social Links
                name: socials
                widget: object
                required: false
                hint: Social profile URLs shown in the top bar.
                fields:
                  - label: YouTube
                    name: youtube
                    widget: string
                    required: false
                    hint: 'Example: ''https://www.youtube.com/@ask4trainings'''
                  - label: Instagram
                    name: instagram
                    widget: string
                    required: false
                    hint: 'Example: ''https://www.instagram.com/ask4trainings'''
                  - label: Facebook
                    name: facebook
                    widget: string
                    required: false
                    hint: 'Example: ''https://facebook.com/ask4trainings'''
                  - label: LinkedIn
                    name: linkedin
                    widget: string
                    required: false
                    hint: 'Example: ''https://linkedin.com/company/ask4trainings'''
                  - label: Twitter / X
                    name: twitter
                    widget: string
                    required: false
                    hint: 'Example: ''https://x.com/ask4trainings'''
          - label: 🔗 Main Navigation Links
            name: mainNav
            widget: list
            hint: Top-level navigation items shown in the header bar. Order determines
              left-to-right display.
            summary: '{{fields.label}} → {{fields.url}}'
            fields:
              - label: Nav Label
                name: label
                widget: string
                hint: 'Example: ''Courses'' or ''Student Registration'''
              - label: URL
                name: url
                widget: string
                hint: 'Example: ''/courses'' or ''/contact-us/'''
              - label: Has Dropdown/Mega Menu?
                name: hasDropdown
                widget: boolean
                default: false
                hint: Enable for nav items that open a mega menu (e.g., Courses, Services).
              - label: Render as CTA Button?
                name: isButton
                widget: boolean
                default: false
                required: false
                hint: Enable to style this nav item as a blue CTA button (e.g., 'Student
                  Registration').
          - label: 📚 Mega Menu Domain Categories
            name: megaMenu
            widget: list
            hint: The domain groups listed in the Courses mega menu dropdown. Each entry
              maps to a category page and course filter key.
            summary: '{{fields.title}} ({{fields.categoryKey}})'
            fields:
              - label: Domain Label
                name: title
                widget: string
                hint: 'Example: ''Guidewire & Insurance'' or ''SAP S/4HANA'''
              - label: Category Filter Key
                name: categoryKey
                widget: string
                hint: 'Example: ''guidewire'' or ''sap'' — Must match the ''category'' field
                  used in course markdown files.'
              - label: Domain Hub URL
                name: url
                widget: string
                hint: 'Example: ''/guidewire-courses'' — The page that lists all courses in this
                  domain.'
      - label: 🏷️ Course Category Pages
        name: categories
        file: src/data/categories.json
        format: json
        fields:
          - label: 📍 Live Location
            name: livePath
            widget: string
            default: Navigation Bar > Mega Menu domain hub pages (e.g., /guidewire-courses/)
            hint: READ-ONLY context marker. These entries power the domain hub landing pages
              accessible from the Mega Menu.
          - label: Category Hub Pages
            name: categories
            widget: list
            summary: '{{fields.name}} ({{fields.slug}})'
            hint: Each entry generates a dedicated domain hub page (e.g.,
              /guidewire-courses/). The SEO copy here appears on that hub page.
            fields:
              - label: Category Display Name
                name: name
                widget: string
                hint: 'Example: ''Guidewire Training'' — Full name shown in page headings.'
              - label: Short Name
                name: shortName
                widget: string
                required: false
                hint: 'Example: ''Guidewire'' — Abbreviated name used in compact UI contexts.'
              - label: URL Slug (Hub Page)
                name: slug
                widget: string
                hint: 'Example: ''guidewire-courses'' — Forms the URL /{slug}/. Must be
                  lowercase with hyphens only.'
              - label: Category Filter Key
                name: categoryKey
                widget: string
                hint: 'Example: ''guidewire'' — Must exactly match the ''category'' field in
                  course markdown frontmatter.'
              - label: Icon Identifier
                name: iconName
                widget: string
                required: false
                hint: 'Example: ''guidewire'' or ''sap'' — Maps to an icon component in the
                  codebase.'
              - label: Hub Page Intro Copy
                name: intro
                widget: text
                hint: '3–5 sentences about this domain shown at the top of the hub page.'
              - label: Career Opportunities Copy
                name: careerCopy
                widget: text
                hint: '2–3 sentences about career prospects for this domain.'
              - label: SEO Meta Title
                name: metaTitle
                widget: string
                hint: 'Example: ''Guidewire Training in Hyderabad | Ask4Trainings'' — Target
                  55–60 characters for SERP display.'
              - label: SEO Meta Description
                name: metaDescription
                widget: text
                hint: 'Example: ''Expert-led Guidewire PolicyCenter, ClaimCenter, and
                  BillingCenter training in Ameerpet, Hyderabad with 100%
                  placement support.'' — Target 145–160 characters.'
      - label: 📋 Enquiry Form Configuration
        name: forms
        file: src/data/forms.json
        format: json
        fields:
          - label: 📍 Live Location
            name: livePath
            widget: string
            default: Student Registration form > Training Mode dropdown; all enquiry forms
            hint: READ-ONLY context marker. These options populate the 'Training Mode'
              dropdown in all lead capture forms.
          - label: Training Mode Dropdown Options
            name: trainingModes
            widget: list
            hint: 'Options shown in the ''Preferred Training Mode'' dropdown on all enquiry
              forms. Example values: ''Live Online'', ''Classroom (Ameerpet)'',
              ''Weekend Fast-Track'', ''Self-Paced''.'
            field:
              label: Mode Label
              name: mode
              widget: string
              hint: Provide a value for Mode Label.
  - name: pages
    label: 📄 Core Site Pages
    editor:
      preview: false
    files:
      - label: 🏠 Homepage (/)
        name: home
        file: src/data/pages/home.json
        format: json
        fields:
          - label: 📍 Live Location
            name: livePath
            widget: string
            default: Homepage → / (root URL)
            hint: READ-ONLY context marker. All edits here appear on the website homepage at
              ask4trainings.com/
          - label: SEO Meta Title
            name: metaTitle
            widget: string
            required: false
            hint: 'Example: ''Ask4Trainings — IT Training Institute in Hyderabad |
              Guidewire, SAP, DevOps'' — Target 55–60 characters.'
          - label: SEO Meta Description
            name: metaDescription
            widget: text
            required: false
            hint: 'Example: ''Ask4Trainings is a premier IT training institute in Ameerpet,
              Hyderabad. Expert-led courses in Guidewire, SAP, DevOps, Cloud,
              Oracle with 100% placement support.'' — Target 145–160
              characters.'
          - label: 🎯 Hero Badge
            name: heroBadge
            widget: string
            hint: 'Example: ''Batch Starting Soon — Limited Seats'' — Small badge text above
              the hero headline.'
          - label: Hero Main Headline
            name: heroTitle
            widget: string
            hint: 'Example: ''Master Enterprise IT Skills. Secure High-Paying Jobs.'' — The
              primary H1 of the homepage hero.'
          - label: Hero Subtitle / Supporting Copy
            name: heroSubtitle
            widget: text
            hint: 'Example: ''Real-world training by industry experts. Specializing in
              Guidewire, SAP, Siemens PLM, DevOps, Cloud, and Data Science.'' —
              1–2 sentences below the headline.'
          - label: Hero CTA Button Label
            name: heroCtaLabel
            widget: string
            hint: 'Example: ''Browse All Courses'''
          - label: Hero CTA Button URL
            name: heroCtaUrl
            widget: string
            hint: 'Example: ''#courses'' or ''/courses/'''
          - label: 📊 Statistics Counter Row — Students Trained
            name: statStudents
            widget: string
            hint: 'Example: ''12,000+'' — Active students trained. Appears in the homepage
              stats bar.'
          - label: Corporate Batches Delivered
            name: statBatches
            widget: string
            hint: 'Example: ''450+'''
          - label: Placement Rate
            name: statPlacement
            widget: string
            hint: 'Example: ''96%'''
          - label: Years of Operation
            name: statYears
            widget: string
            hint: 'Example: ''10+'''
          - label: Trust Badges
            name: trustBadges
            widget: list
            required: false
            summary: '{{fields.label}}: {{fields.value}}'
            hint: 'Small credibility badges shown below the hero CTA. Example: { label:
              ''Industry Mentors'', value: ''10+ yrs'' }.'
            fields:
              - label: Badge Label
                name: label
                widget: string
                hint: 'Example: ''Industry Mentors'' or ''Placement Support'''
              - label: Badge Value
                name: value
                widget: string
                hint: 'Example: ''10+ yrs'' or ''100%'''
          - label: 🏢 About Section Eyebrow
            name: aboutEyebrow
            widget: string
            hint: 'Example: ''About Ask4Trainings'' — Small uppercase eyebrow label above
              the about section headline.'
          - label: About Section Headline
            name: aboutTitle
            widget: string
            hint: 'Example: ''Hyderabad''s Trusted Hub for Real-Time IT & Software
              Training'''
          - label: About Section Body Copy
            name: aboutBody
            widget: text
            hint: '2–3 sentences about Ask4Trainings shown in the About section.'
          - label: About Pillars / Value Props
            name: aboutPillars
            widget: list
            required: false
            summary: '{{fields.title}}'
            hint: 4 key value propositions shown as icon cards in the About section.
            fields:
              - label: Pillar Title
                name: title
                widget: string
                hint: 'Example: ''Real-Time Project Training'''
              - label: Pillar Description
                name: description
                widget: text
                hint: 'Example: ''Hands-on learning with live enterprise use cases, sandbox
                  environments, and real-world scenario practice.'''
          - label: 👩‍🏫 Become an Instructor Badge
            name: instructorBadge
            widget: string
            hint: 'Example: ''💼 We Are Hiring IT Trainers & Mentors'''
          - label: Instructor Section Headline
            name: instructorTitle
            widget: string
            hint: 'Example: ''Teach What You Master. Earn on Your Schedule.'''
          - label: Instructor Section Body
            name: instructorText
            widget: text
            hint: 'Example: ''Are you an experienced IT professional? Join our faculty team
              and share your expertise with the next generation of engineers.'''
          - label: 📚 Trending Courses Eyebrow Label
            name: trendingEyebrow
            widget: string
            hint: 'Example: ''Most In-Demand'''
          - label: Trending Section Headline
            name: trendingTitle
            widget: string
            hint: 'Example: ''Trending Courses'''
          - label: 🗂️ Category Browse Section Eyebrow
            name: categoriesEyebrow
            widget: string
            hint: 'Example: ''All Domains'''
          - label: Categories Section Headline
            name: categoriesTitle
            widget: string
            hint: 'Example: ''Choose Your Training Category'''
          - label: Training Category Cards (Browse Section)
            name: trainingCategories
            widget: list
            hint: The domain category cards shown in the 'Browse by Category' section of the
              homepage.
            summary: '{{fields.name}} → {{fields.url}}'
            fields:
              - label: Category Name
                name: name
                widget: string
                hint: 'Example: ''Guidewire'' or ''SAP S/4HANA'''
              - label: Target URL
                name: url
                widget: string
                hint: 'Example: ''/guidewire-courses/'''
              - label: Icon SVG Code
                name: icon
                widget: text
                hint: 'Paste raw inline SVG markup here. Must be a valid <svg>...</svg> string.
                  Recommended size: 24x24.'
              - label: Card Description
                name: desc
                widget: string
                hint: 'Example: ''Live online & classroom courses in PolicyCenter,
                  BillingCenter, ClaimCenter.'' — 1 sentence, max 100 chars.'
      - label: 🏢 About Us (/about-us)
        name: about
        file: src/data/pages/about.json
        format: json
        fields:
          - label: 📍 Live Location
            name: livePath
            widget: string
            default: Navigation Bar > About Us → /about-us/
            hint: READ-ONLY context marker. All edits here appear on
              ask4trainings.com/about-us/
          - label: SEO Meta Title
            name: metaTitle
            widget: string
            required: false
            hint: 'Example: ''About Ask4Trainings | Premier IT Training Institute in
              Hyderabad'' — Target 55–60 characters.'
          - label: SEO Meta Description
            name: metaDescription
            widget: text
            required: false
            hint: 'Example: ''Learn about Ask4Trainings, our state-of-the-art Ameerpet
              facility, and our mission to provide industry-leading Guidewire,
              SAP, and DevOps training.'' — Target 145–160 characters.'
          - label: Page Hero Headline
            name: heroTitle
            widget: string
            hint: 'Example: ''About Ask4Trainings'''
          - label: Page Hero Subtitle
            name: heroSubtitle
            widget: text
            hint: 'Example: ''Empowering careers through high-quality, industry-aligned IT
              training in Hyderabad.'''
          - label: Who We Are Section Title
            name: whoWeAreTitle
            widget: string
            hint: 'Example: ''Who We Are'''
          - label: Who We Are Body Copy
            name: whoWeAre
            widget: text
            hint: '2–4 sentences about Ask4Trainings mission and specializations.'
          - label: Mission Section Title
            name: missionTitle
            widget: string
            hint: 'Example: ''Our Mission'''
          - label: Mission / Vision Statement
            name: companyVision
            widget: text
            hint: 'Example: ''To bridge the gap between academic education and enterprise
              industry expectations by providing world-class, practical IT
              training.'' — 1–2 sentences.'
          - label: Facility Section Title
            name: facilityTitle
            widget: string
            hint: 'Example: ''Our Facility'''
          - label: Facility Details
            name: facilityDetails
            widget: text
            hint: 'Example: ''Located in the heart of Ameerpet, Hyderabad, our training
              center features state-of-the-art labs, high-speed connectivity,
              and dedicated interview preparation zones.'''
          - label: Milestones Section Title
            name: milestonesTitle
            widget: string
            hint: 'Example: ''Milestones'''
          - label: Milestones Summary Text
            name: milestones
            widget: text
            hint: 'Example: ''Founded in 2012. Trained over 12,000 students. Placed
              candidates in top Fortune 500 companies globally.'''
          - label: Leadership Section Title
            name: leadershipTitle
            widget: string
            hint: 'Example: ''Leadership'''
          - label: Leadership Bios Summary
            name: leadershipBios
            widget: text
            hint: 'Example: ''Our founders and senior trainers bring decades of collective
              experience from top-tier product and service-based IT
              organizations.'''
          - label: Why Choose Us Section Title
            name: whyChooseTitle
            widget: string
            hint: 'Example: ''Why Choose Ask4Trainings?'''
          - label: Why Choose Us Items
            name: whyChooseUs
            widget: list
            hint: Checklist items shown in the 'Why Choose Us' section. Each item has a
              title and a short description.
            summary: '{{fields.title}}'
            fields:
              - label: Item Title
                name: title
                widget: string
                hint: 'Example: ''Expert Trainers'' or ''100% Placement Assistance'''
              - label: Item Description
                name: description
                widget: text
                hint: 'Example: ''Learn from industry professionals with years of real-world
                  experience across Guidewire, SAP, and Cloud platforms.'''
      - label: 📞 Contact Us (/contact-us)
        name: contact
        file: src/data/pages/contact.json
        format: json
        fields:
          - label: 📍 Live Location
            name: livePath
            widget: string
            default: Navigation Bar > Contact Us → /contact-us/
            hint: READ-ONLY context marker. All edits here appear on
              ask4trainings.com/contact-us/
          - label: SEO Meta Title
            name: metaTitle
            widget: string
            required: false
            hint: 'Example: ''Contact Ask4Trainings | Ameerpet Campus & Online Enquiries'' —
              Target 55–60 characters.'
          - label: SEO Meta Description
            name: metaDescription
            widget: text
            required: false
            hint: 'Example: ''Get in touch with Ask4Trainings. Call us, WhatsApp us, or
              visit our Ameerpet campus for course enquiries and batch
              scheduling.'' — Target 145–160 characters.'
          - label: Page Hero Headline
            name: heroTitle
            widget: string
            hint: 'Example: ''Contact Us'''
          - label: Hero Subtitle
            name: heroSubtitle
            widget: text
            hint: 'Example: ''Have a question about a course? Ready to enquire? We''ll
              respond within 2 hours on WhatsApp or call you back within the
              day.'''
          - label: Contact Section Heading
            name: sectionTitle
            widget: string
            hint: 'Example: ''Get In Touch'''
          - label: Institute Full Name
            name: instituteName
            widget: string
            hint: 'Example: ''Ask4Trainings IT Training Institute'''
          - label: Full Office Address
            name: addressDetails
            widget: text
            hint: 'Example: ''House No:403, 4th Floor, Naga Sai Nivas, near Prime Hospital
              Lane, Ameerpet, Hyderabad, Telangana 500016'''
          - label: Google Maps Embed URL
            name: googleMapsEmbedUrl
            widget: string
            hint: 'Example: ''https://www.google.com/maps/embed?pb=...'' — Paste the full
              Google Maps embed src URL (from Google Maps > Share > Embed a
              map).'
          - label: Branch Operating Hours
            name: batchHours
            widget: text
            hint: |-
              Example: 'Monday to Friday: 7:00 AM - 9:00 PM
              Saturday to Sunday: 9:00 AM - 6:00 PM'
          - label: Helpline Numbers (Display)
            name: helplineNumbers
            widget: string
            hint: 'Example: ''+91 8099949888, +91 9951609609'' — Comma-separated list for
              display in the contact info block.'
          - label: Support Email
            name: supportEmail
            widget: string
            hint: 'Example: ''info@ask4trainings.com'''
          - label: WhatsApp Number (Digits Only)
            name: whatsappNumber
            widget: string
            hint: 'Example: ''918099949888'' — Country code + 10 digits, no spaces or
