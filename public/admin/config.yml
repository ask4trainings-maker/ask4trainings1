  - name: courses
    label: 🎓 Course Catalog
    folder: src/content/courses
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    editor:
      preview: false
    sortable_fields:
      - category
      - priorityTier
      - title
      - updatedDate
    view_groups:
      - label: By Domain Category
        field: category
      - label: By Priority Tier
        field: priorityTier
    view_filters:
      - label: '⭐ Tier 1: Flagship Courses'
        field: priorityTier
        pattern: tier1
      - label: '📈 Tier 2: Growth Programs'
        field: priorityTier
        pattern: tier2
      - label: '📘 Tier 3: Supporting Courses'
        field: priorityTier
        pattern: tier3
      - label: 🛡️ Guidewire & Insurance
        field: category
        pattern: guidewire
      - label: ⚙️ Siemens PLM
        field: category
        pattern: siemens
      - label: 🔷 SAP S/4HANA
        field: category
        pattern: sap
      - label: ☁️ Cloud Computing
        field: category
        pattern: cloud-computing
      - label: 🔧 DevOps
        field: category
        pattern: devops
      - label: 💻 Software Development
        field: category
        pattern: development
      - label: 🌐 Microsoft Dynamics 365
        field: category
        pattern: ms-d365
      - label: 🔶 Oracle & ERP
        field: category
        pattern: oracle
      - label: 🚀 Trending Technologies
        field: category
        pattern: trending-courses
      - label: ✨ New Courses
        field: category
        pattern: new-courses
      - label: 🧰 Other Tools
        field: category
        pattern: other-tools
    fields:
      - label: "📍 Live Navigation Location"
        name: "navigationLocation"
        widget: "string"
        readonly: true
        required: false
        hint: "System breadcrumb showing where this course appears in the live navigation. (Read-only)."
      - label: "🌟 Course Promotion Tier"
        name: "priorityTier"
        widget: "select"
        options:
          - { label: "🌟 Tier 1: Flagship Program (Top Priority Placement)", value: "tier-1" }
          - { label: "📈 Tier 2: Core Growth Course", value: "tier-2" }
          - { label: "📘 Tier 3: Specialized / Supporting Tool", value: "tier-3" }
        default: "tier-2"
        hint: "Select ranking priority on the catalog and homepage."
      - label: "Course Title"
        name: "title"
        widget: "string"
        required: true
      - label: "Course Slug"
        name: "slug"
        widget: "string"
        required: true
      - label: "Last Updated Date"
        name: "updatedDate"
        widget: "datetime"
        required: false
      - label: "Course Badge / Short Code"
        name: "badge"
        widget: "string"
      - label: "Domain Category"
        name: "category"
        widget: "select"
        options:
          - label: "🛡️ Guidewire Suite"
            value: "guidewire"
          - label: "⚙️ Siemens Teamcenter / PLM"
            value: "siemens"
          - label: "🔷 SAP Solutions"
            value: "sap"
          - label: "☁️ Cloud Computing"
            value: "cloud-computing"
          - label: "🔧 DevOps"
            value: "devops"
          - label: "💻 Software Development"
            value: "development"
          - label: "🌐 Microsoft Dynamics 365"
            value: "ms-d365"
          - label: "🔶 Oracle Cloud"
            value: "oracle"
          - label: "🚀 Trending Technologies"
            value: "trending-courses"
          - label: "✨ New Courses"
            value: "new-courses"
          - label: "🧰 Other Specialized Tools"
            value: "other-tools"
      - label: "Rating"
        name: "rating"
        widget: "string"
        default: "4.9"
      - label: "Course Description Main"
        name: "valueProp"
        widget: "text"
        required: false
        hint: "Main lead description displayed under the H1 in the hero section."
      - label: "Batch & Schedule Information"
        name: "batchInfo"
        widget: "object"
        required: false
        fields:
          - { label: "Batch Type", name: "type", widget: "string", hint: "e.g., 'Weekday / Weekend Batches'" }
          - { label: "Duration", name: "duration", widget: "string", hint: "e.g., '45-60 Hours'" }
          - { label: "Training Mode", name: "mode", widget: "string", hint: "e.g., '100% Live Interactive Online'" }
          - { label: "Next Cohort Start Date", name: "startDate", widget: "string", hint: "e.g., 'Upcoming Monday'" }
      - label: "📚 Course Curriculum Modules"
        name: "modules"
        widget: "list"
        summary: "Module: {{fields.title}} ({{fields.duration}})"
        fields:
          - { label: "Module Title", name: "title", widget: "string", required: true }
          - { label: "Duration / Topic Count", name: "duration", widget: "string", hint: "e.g., '6 Topics' or '8 Hours'" }
          - label: "Lessons & Topics"
            name: "topics"
            widget: "list"
            field: { label: "Topic Description", name: "topic", widget: "string" }
      - label: "🎯 Who Should Enroll?"
        name: "whoShouldEnroll"
        widget: "list"
        summary: "{{fields.title}}"
        fields:
          - { label: "Profile Title", name: "title", widget: "string", hint: "e.g., 'IT Professionals' or 'Fresh Graduates'" }
          - { label: "Profile Description", name: "description", widget: "text" }
      - label: "👨‍🏫 Trainer Section"
        name: "trainer"
        widget: "object"
        required: false
        fields:
          - { label: "Trainer Headline", name: "title", widget: "string", hint: "e.g., 'Expert Led Guidewire Trainer'" }
          - { label: "Trainer Description", name: "description", widget: "text", hint: "Summary of hands-on enterprise mentoring and experience." }
          - label: "Trainer Highlights"
            name: "highlights"
            widget: "list"
            field: { label: "Highlight Item", name: "item", widget: "string", hint: "e.g., '10+ Years of Enterprise Production Experience'" }
      - label: "❓ Frequently Asked Questions"
        name: "faqs"
        widget: "list"
        summary: "Q: {{fields.question}}"
        fields:
          - { label: "Question", name: "question", widget: "string", required: true }
          - { label: "Answer", name: "answer", widget: "text", required: true }
      - label: "🔍 Search Engine Optimization (SEO)"
        name: "seo"
        widget: "object"
        fields:
          - { label: "Meta Title Tag", name: "metaTitle", widget: "string", hint: "Page title for Google search results." }
          - { label: "Meta Description Tag", name: "metaDescription", widget: "text", hint: "150-160 characters search snippet summary." }
