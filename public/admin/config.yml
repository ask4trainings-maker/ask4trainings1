backend:
  name: github
  repo: rahulabhishek5/ask4trainings
  branch: main
  base_url: https://ask4trainings.pages.dev
  auth_endpoint: /api/auth

publish_mode: editorial_workflow
local_backend: false
logo_url: /logo.svg

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:

  # ─────────────────────────────────────────────────────────────────────────
  # 1. GLOBAL SETTINGS — settings.json (contact, socials, topBanner)
  # ─────────────────────────────────────────────────────────────────────────
  - name: global_settings
    label: 🌐 Global Settings
    editor:
      preview: false
    files:
      - label: ⚙️ Site-Wide Settings (Contact, Socials, Banner)
        name: site_settings
        file: src/data/settings.json
        format: json
        fields:
          - label: 📍 Live Location
            name: livePath
            widget: string
            default: "Sitewide — Header, Footer, Contact Page, Banner"
            required: false
            hint: "READ-ONLY. These values appear across every page."

          - label: 📞 Contact Information
            name: contact
            widget: object
            hint: "Used on the Contact Us page and header. Update carefully."
            fields:
              - label: Support Email
                name: email
                widget: string
                hint: "e.g., ask4trainings@gmail.com"
              - label: Primary Phone
                name: phone1
                widget: string
                hint: "e.g., +91 8099949888 — shown in the header and contact page."
              - label: Office Address
                name: address
                widget: text
                hint: "e.g., Ameerpet, Hyderabad, Telangana, India"
              - label: Office Hours
                name: hours
                widget: string
                hint: "e.g., Mon-Sat 8:00 AM - 8:00 PM"
              - label: Google Maps URL
                name: mapsUrl
                widget: string
                required: false
                hint: "e.g., https://maps.google.com/maps?q=ameerpet"

          - label: 🔗 Social Media Links
            name: socials
            widget: object
            hint: "Social URLs used in the header and contact page. Leave blank to hide that platform."
            fields:
              - label: Facebook URL
                name: facebook
                widget: string
                required: false
                hint: "e.g., https://www.facebook.com/ask4trainings"
              - label: X (Twitter) URL
                name: twitter
                widget: string
                required: false
                hint: "e.g., https://x.com/ask4trainings"
              - label: LinkedIn URL
                name: linkedin
                widget: string
                required: false
                hint: "e.g., https://www.linkedin.com/company/ask4trainings"
              - label: YouTube Channel URL
                name: youtube
                widget: string
                required: false
                hint: "e.g., https://www.youtube.com/@ask4trainings"
              - label: Instagram URL
                name: instagram
                widget: string
                required: false
                hint: "e.g., https://www.instagram.com/ask4trainings"

          - label: 📢 Top Announcement Banner
            name: topBanner
            widget: object
            hint: "The dismissible banner strip shown at the top of every page."
            fields:
              - label: Banner Text
                name: text
                widget: string
                hint: "e.g., 'Guidewire Weekend Batch starting this Saturday! Limited seats.'"

  # ─────────────────────────────────────────────────────────────────────────
  # 2. CORE SITE PAGES
  # ─────────────────────────────────────────────────────────────────────────
  - name: pages
    label: 📄 Core Site Pages
    editor:
      preview: false
    files:

      # ── Homepage (home.json) ───────────────────────────────────────────────
      - label: 🏠 Homepage (/)
        name: home
        file: src/data/pages/home.json
        format: json
        fields:
          - label: 📍 Live Location
            name: livePath
            widget: string
            default: "Homepage → / (root URL)"
            required: false
            hint: "READ-ONLY. All edits here appear on ask4trainings.com/"

          - label: "── Section 1: Hero Banner ──"
            name: hero
            widget: object
            hint: "The main hero section at the top of the homepage."
            fields:
              - label: Hero Headline (HTML)
                name: headline
                widget: string
                hint: "Main H1 text. HTML allowed. e.g., 'Practical Industry Skills.<br />'"
              - label: Hero Gradient Highlight
                name: headlineGradient
                widget: string
                hint: "The gradient-colored portion of the headline. e.g., 'Accelerate Your Enterprise Career.'"
              - label: Hero Sub-headline
                name: subheadline
                widget: text
                hint: "Supporting text below the H1. 2-3 sentences."
              - label: Primary CTA Button Label
                name: primaryCta
                widget: string
                hint: "e.g., 'Explore Courses'"
              - label: Secondary CTA Button Label
                name: secondaryCta
                widget: string
                hint: "e.g., 'Book Live Demo'"

          - label: "── Section 2: Stats Metrics Row ──"
            name: metrics
            widget: list
            summary: "{{fields.value}} — {{fields.label}}"
            hint: "Numeric credibility metrics shown in the hero stats bar (e.g., 15+ Years, 50k+ Alumni)."
            fields:
              - label: Metric Value
                name: value
                widget: string
                hint: "e.g., '15+' or '50k+'"
              - label: Metric Label
                name: label
                widget: string
                hint: "e.g., 'Years Exp' or 'Alumni'"

          - label: "── Section 3: Why Choose Us Cards (Bento) ──"
            name: bento
            widget: list
            summary: "{{fields.title}}"
            hint: "4 value proposition cards shown in the 'Why Choose Us' section."
            fields:
              - label: Card Title
                name: title
                widget: string
                hint: "e.g., 'Live Interactive Classes'"
              - label: Card Description
                name: description
                widget: text
                hint: "Short supporting description for this value prop."

          - label: "── Section 4: Learning Roadmap ──"
            name: roadmap
            widget: list
            summary: "{{fields.title}}"
            hint: "4 steps in the learning journey shown on the homepage."
            fields:
              - label: Step Title
                name: title
                widget: string
                hint: "e.g., 'Core Architecture'"
              - label: Step Description
                name: description
                widget: text
                hint: "e.g., 'Master foundational concepts and enterprise frameworks.'"

          - label: "── Section 5: Final CTA Block ──"
            name: conversion
            widget: object
            hint: "The bottom conversion section headline and subtext."
            fields:
              - label: CTA Headline (HTML)
                name: headline
                widget: string
                hint: 'Supports HTML. e.g., "Ready to Upgrade Your <br/><span class="text-primary-light">Career Trajectory?</span>"'
              - label: CTA Sub-text
                name: subtext
                widget: text
                hint: "Supporting paragraph under the CTA headline."

      # ── About Us (about.json) ─────────────────────────────────────────────
      - label: 🏢 About Us (/about-us)
        name: about
        file: src/data/pages/about.json
        format: json
        fields:
          - label: 📍 Live Location
            name: livePath
            widget: string
            default: "Navigation → About Us → /about-us/"
            required: false
            hint: "READ-ONLY. All edits here appear on ask4trainings.com/about-us/"

          - label: "── Institute Story ──"
            name: story
            widget: text
            hint: "2-4 sentence overview about Ask4Trainings shown at the top of the About page."

          - label: "── Timeline Milestones ──"
            name: milestones
            widget: list
            summary: "{{fields.year}} — {{fields.title}}"
            hint: "Key milestones in the institute's journey (shown as a vertical timeline)."
            fields:
              - label: Year
                name: year
                widget: string
                hint: "e.g., '2018'"
              - label: Milestone Title
                name: title
                widget: string
                hint: "e.g., 'Foundation'"
              - label: Description
                name: description
                widget: text
                hint: "Brief description of what happened in this milestone year."

          - label: "── Expert Faculty Cards ──"
            name: faculty
            widget: list
            summary: "{{fields.name}} — {{fields.role}}"
            hint: "Faculty members shown as profile cards in the Expert Faculty section."
            fields:
              - label: Name
                name: name
                widget: string
                hint: "e.g., 'Senior Architect'"
              - label: Role / Title
                name: role
                widget: string
                hint: "e.g., 'Guidewire Configuration Lead'"
              - label: Bio
                name: bio
                widget: text
                hint: "1-2 sentence bio. e.g., '12+ years of enterprise experience.'"

          - label: "── Lab Infrastructure Checklist ──"
            name: infrastructure
            widget: list
            summary: "{{fields.value}}"
            hint: "Bullet points shown in the Lab Infrastructure section (e.g., 99.9% Uptime Guarantee)."
            field:
              label: Feature
              name: value
              widget: string
              hint: "e.g., 'Zero-setup environments' or '99.9% Uptime Guarantee'"

      # ── Contact Us (contact.json) ────────────────────────────────────────
      - label: 📞 Contact Us (/contact-us)
        name: contact
        file: src/data/pages/contact.json
        format: json
        fields:
          - label: 📍 Live Location
            name: livePath
            widget: string
            default: "Navigation → Contact Us → /contact-us/"
            required: false
            hint: "READ-ONLY. Edits here affect the enquiry form sidebar on the Contact page."
          - label: Enquiry Form Header
            name: formHeader
            widget: string
            hint: "Heading shown above the contact form. e.g., 'Send an Enquiry'"
          - label: Enquiry Form Sub-text
            name: formSubtext
            widget: text
            hint: "Short description under the form heading. e.g., 'Fill out the form and our team will respond within 2 hours.'"
          - label: Guidelines / Notes
            name: guidelines
            widget: text
            required: false
            hint: "Optional internal notes or instructions for corporate / course enquiries."

  # ─────────────────────────────────────────────────────────────────────────
  # 3. COURSE PAGES — markdown content in src/content/courses/
  # ─────────────────────────────────────────────────────────────────────────
  - name: courses
    label: 🎓 Edit Course Pages
    folder: src/content/courses
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    editor:
      preview: false
    sortable_fields:
      - category
      - priorityTier
      - title
      - updatedDate
    view_groups:
      - label: By Domain Category
        field: category
      - label: By Priority Tier
        field: priorityTier
    view_filters:
      - label: '⭐ Tier 1: Flagship Courses'
        field: priorityTier
        pattern: tier-1
      - label: '📈 Tier 2: Core Growth'
        field: priorityTier
        pattern: tier-2
      - label: '📘 Tier 3: Specialized'
        field: priorityTier
        pattern: tier-3
      - label: 🛡️ Guidewire & Insurance
        field: category
        pattern: guidewire
      - label: ⚙️ Siemens PLM
        field: category
        pattern: siemens
      - label: 🔷 SAP
        field: category
        pattern: sap
      - label: ☁️ Cloud Computing
        field: category
        pattern: cloud-computing
      - label: 🔧 DevOps
        field: category
        pattern: devops
      - label: 💻 Software Development
        field: category
        pattern: development
      - label: 🌐 Microsoft Dynamics 365
        field: category
        pattern: ms-d365
      - label: 🔶 Oracle & ERP
        field: category
        pattern: oracle
      - label: 🚀 Trending Technologies
        field: category
        pattern: trending-courses
      - label: ✨ New Courses
        field: category
        pattern: new-courses
      - label: 🧰 Other Tools
        field: category
        pattern: other-tools
    fields:

      # ── Navigation & Identity (Top of Page) ──
      - label: "📍 Live Navigation Location"
        name: "navigationLocation"
        widget: "string"
        readonly: true
        required: false
        hint: "Breadcrumb showing where this course appears in site navigation. Managed automatically."

      - label: "🌟 Course Promotion Tier"
        name: "priorityTier"
        widget: "select"
        options:
          - { label: "🌟 Tier 1: Flagship Program (Top Priority)", value: "tier-1" }
          - { label: "📈 Tier 2: Core Growth Course", value: "tier-2" }
          - { label: "📘 Tier 3: Specialized / Supporting Course", value: "tier-3" }
        default: "tier-2"
        hint: "Controls ranking on the catalog homepage. Tier 1 = featured prominently."

      - label: "Course Title (H1)"
        name: "title"
        widget: "string"
        required: true
        hint: "The main heading shown at the top of the course page."

      - label: "URL Slug"
        name: "slug"
        widget: "string"
        required: true
        hint: "Permanent URL path, e.g., 'guidewire-policycenter-online-training'. Do NOT change after publishing."

      - label: "Last Updated Date"
        name: "updatedDate"
        widget: "datetime"
        required: false
        hint: "Optional. Leave blank if unknown. Used for sortable_fields."

      - label: "Course Badge / Short Code"
        name: "badge"
        widget: "string"
        required: false
        hint: "Compact badge shown on course cards. e.g., 'GW PC' or 'SAP FICO'."

      - label: "Domain Category"
        name: "category"
        widget: "select"
        options:
          - { label: "🛡️ Guidewire Suite", value: "guidewire" }
          - { label: "⚙️ Siemens Teamcenter / PLM", value: "siemens" }
          - { label: "🔷 SAP Solutions", value: "sap" }
          - { label: "☁️ Cloud Computing", value: "cloud-computing" }
          - { label: "🔧 DevOps", value: "devops" }
          - { label: "💻 Software Development", value: "development" }
          - { label: "🌐 Microsoft Dynamics 365", value: "ms-d365" }
          - { label: "🔶 Oracle Cloud & ERP", value: "oracle" }
          - { label: "🚀 Trending Technologies", value: "trending-courses" }
          - { label: "✨ New Courses", value: "new-courses" }
          - { label: "🧰 Other Specialized Tools", value: "other-tools" }
        hint: "Select the domain this course belongs to. Controls filtering on the catalog."

      - label: "Course Rating"
        name: "rating"
        widget: "string"
        default: "4.9"
        hint: "Displayed star rating. e.g., '4.9'"

      # ── Hero Overview & Batches ──
      - label: "Course Description Main"
        name: "valueProp"
        widget: "text"
        required: false
        hint: "Lead description paragraph displayed under the H1 in the hero section. 2-4 sentences."

      - label: "Batch & Schedule Information"
        name: "batchInfo"
        widget: "object"
        required: false
        hint: "Batch timing details shown in the hero info chips."
        fields:
          - { label: "Batch Schedule", name: "type", widget: "string", hint: "e.g., 'Weekday / Weekend Batches'" }
          - { label: "Program Duration", name: "duration", widget: "string", hint: "e.g., '45-60 Hours'" }
          - { label: "Training Mode", name: "mode", widget: "string", hint: "e.g., '100% Live Interactive Online'" }
          - { label: "Next Cohort Date", name: "startDate", widget: "string", hint: "e.g., 'Upcoming Monday'" }

      # ── Curriculum Modules ──
      - label: "📚 Course Curriculum Modules"
        name: "modules"
        widget: "list"
        summary: "Module: {{fields.title}} ({{fields.duration}})"
        hint: "Curriculum accordion on the course page. Each item is one collapsible module."
        fields:
          - { label: "Module Title", name: "title", widget: "string", required: true, hint: "e.g., 'Introduction to PolicyCenter Architecture'" }
          - { label: "Topic Count / Duration", name: "duration", widget: "string", hint: "e.g., '6 Topics' or '8 Hours'" }
          - label: "Lessons & Topics"
            name: "topics"
            widget: "list"
            summary: "{{fields.topic}}"
            field: { label: "Topic Description", name: "topic", widget: "string", hint: "e.g., 'Understanding ProductModel XML'" }

      # ── Who Should Enroll ──
      - label: "🎯 Who Should Enroll?"
        name: "whoShouldEnroll"
        widget: "list"
        summary: "{{fields.title}}"
        hint: "Candidate profiles shown in the Eligibility section."
        fields:
          - { label: "Candidate Profile", name: "title", widget: "string", hint: "e.g., 'IT Professionals' or 'Fresh Engineering Graduates'" }
          - { label: "Profile Description", name: "description", widget: "text", hint: "1-2 sentences describing this candidate segment." }

      # ── Trainer Section ──
      - label: "👨‍🏫 Trainer Section"
        name: "trainer"
        widget: "object"
        required: false
        hint: "Content for the Expert Trainer section. Note: the trainer illustration is an SVG component — no image upload needed."
        fields:
          - { label: "Trainer Headline", name: "title", widget: "string", hint: "e.g., 'Expert Led Guidewire Trainer'" }
          - { label: "Trainer Background & Experience", name: "description", widget: "text", hint: "Summary of the trainer's enterprise background and mentoring approach." }
          - label: "Trainer Highlights"
            name: "highlights"
            widget: "list"
            summary: "{{fields.item}}"
            field: { label: "Highlight Bullet", name: "item", widget: "string", hint: "e.g., '10+ Years of Enterprise Production Experience'" }

      # ── FAQs ──
      - label: "❓ Frequently Asked Questions"
        name: "faqs"
        widget: "list"
        summary: "Q: {{fields.question}}"
        hint: "FAQ accordion at the bottom of the course page."
        fields:
          - { label: "Question", name: "question", widget: "string", required: true }
          - { label: "Detailed Answer", name: "answer", widget: "text", required: true }

      # ── SEO (Bottom — always last) ──
      - label: "🔍 Search Engine Optimization (SEO)"
        name: "seo"
        widget: "object"
        hint: "Metadata for Google search results. Placed at the bottom of the editor."
        fields:
          - { label: "Google Meta Title", name: "metaTitle", widget: "string", hint: "Page title for Google (50-60 characters max). e.g., 'Guidewire PolicyCenter Training in Hyderabad | Ask4Trainings'" }
          - { label: "Google Meta Description", name: "metaDescription", widget: "text", hint: "Search snippet summary (140-160 characters max)." }

  # ─────────────────────────────────────────────────────────────────────────
  # 4. SERVICES & PROGRAMS
  # ─────────────────────────────────────────────────────────────────────────
  - name: services
    label: 💼 Services & Programs
    editor:
      preview: false
    files:
      - label: 🛠️ On-Job Support (/work-support)
        name: on_job_support
        file: src/data/services/on-job-support.json
        format: json
        fields:
          - label: 📍 Live Location
            name: livePath
            widget: string
            default: "Navigation → Services → Work Support → /work-support/"
            hint: "READ-ONLY context marker."
          - label: SEO Meta Title
            name: metaTitle
            widget: string
            required: false
            hint: "e.g., 'IT Job Support & Project Assistance | Ask4Trainings Hyderabad'"
          - label: SEO Meta Description
            name: metaDescription
            widget: text
            required: false
            hint: "140-160 characters search snippet for this service page."
          - label: Hero Badge
            name: badge
            widget: string
            hint: "e.g., '100% Confidential & Real-Time Support'"
          - label: Hero Headline
            name: heroTitle
            widget: string
            hint: "e.g., 'Reliable On-Job IT Work Support'"
          - label: Hero Subtitle
            name: heroSubtitle
            widget: text
            hint: "2-3 sentences describing the service."
          - label: Primary CTA Label
            name: primaryCtaLabel
            widget: string
            hint: "e.g., 'Request Support Now'"
          - label: Primary CTA URL
            name: primaryCtaUrl
            widget: string
            hint: "e.g., '#support-form'"
          - label: WhatsApp CTA Label
            name: whatsappCtaLabel
            widget: string
            hint: "e.g., 'Instant WhatsApp Query'"
          - label: Technologies Section Title
            name: introTitle
            widget: string
            hint: "e.g., 'Technologies We Support'"
          - label: Technologies Section Intro
            name: introBody
            widget: text
            hint: "2-3 sentences about the supported tech domains."
          - label: Supported Technologies
            name: technologies
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { label: "Technology Title", name: "title", widget: "string", hint: "e.g., 'Guidewire Suite'" }
              - { label: "Scope Description", name: "desc", widget: "string", hint: "e.g., 'PolicyCenter, BillingCenter, ClaimCenter, Gosu, PCF & Rating'" }
          - label: Process Section Title
            name: processTitle
            widget: string
            hint: "e.g., 'How Our Job Support Works'"
          - label: Support Process Steps
            name: processSteps
            widget: list
            summary: 'Step {{fields.step}}: {{fields.title}}'
            fields:
              - { label: "Step Number", name: "step", widget: "string" }
              - { label: "Step Title", name: "title", widget: "string" }
              - { label: "Step Description", name: "desc", widget: "text" }
          - label: Contact Form Title
            name: formTitle
            widget: string
            hint: "e.g., 'Get Job Support Consultation'"
          - label: Contact Form Subtitle
            name: formSubtitle
            widget: text
            hint: "e.g., '100% confidential. Tell us your technology and get matched with a consultant today.'"

      - label: 🏢 Corporate Training
        name: corporate_training
        file: src/data/services/corporate-training.json
        format: json
        fields:
          - label: 📍 Live Location
            name: livePath
            widget: string
            default: "Navigation → Services → Corporate Training"
            hint: "READ-ONLY context marker."
          - label: SEO Meta Title
            name: metaTitle
            widget: string
            required: false
            hint: "e.g., 'Corporate IT Training | Ask4Trainings Hyderabad'"
          - label: SEO Meta Description
            name: metaDescription
            widget: text
            required: false
            hint: "140-160 character search snippet."
          - label: Hero Badge
            name: badge
            widget: string
            hint: "e.g., 'Enterprise Enablement'"
          - label: Hero Headline
            name: heroTitle
            widget: string
            hint: "e.g., 'Corporate Training for Enterprise Teams'"
          - label: Hero Subtitle
            name: heroSubtitle
            widget: text
          - label: Primary CTA Label
            name: primaryCtaLabel
            widget: string
          - label: Primary CTA URL
            name: primaryCtaUrl
            widget: string
          - label: WhatsApp CTA Label
            name: whatsappCtaLabel
            widget: string
          - label: Intro Section Title
            name: introTitle
            widget: string
          - label: Intro Section Body
            name: introBody
            widget: text
          - label: Training Domains
            name: technologies
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { label: "Domain Title", name: "title", widget: "string" }
              - { label: "Domain Description", name: "desc", widget: "string" }
          - label: Process Section Title
            name: processTitle
            widget: string
          - label: Engagement Process Steps
            name: processSteps
            widget: list
            summary: 'Step {{fields.step}}: {{fields.title}}'
            fields:
              - { label: "Step Number", name: "step", widget: "string" }
              - { label: "Step Title", name: "title", widget: "string" }
              - { label: "Step Description", name: "desc", widget: "text" }
          - label: Form Title
            name: formTitle
            widget: string
          - label: Form Subtitle
            name: formSubtitle
            widget: text

      - label: 🎯 Placement Assistance
        name: placement_assistance
        file: src/data/services/placement-assistance.json
        format: json
        fields:
          - label: 📍 Live Location
            name: livePath
            widget: string
            default: "Navigation → Services → Placement Assistance"
            hint: "READ-ONLY context marker."
          - label: SEO Meta Title
            name: metaTitle
            widget: string
            required: false
          - label: SEO Meta Description
            name: metaDescription
            widget: text
            required: false
          - label: Hero Badge
            name: badge
            widget: string
          - label: Hero Headline
            name: heroTitle
            widget: string
          - label: Hero Subtitle
            name: heroSubtitle
            widget: text
          - label: Primary CTA Label
            name: primaryCtaLabel
            widget: string
          - label: Primary CTA URL
            name: primaryCtaUrl
            widget: string
          - label: WhatsApp CTA Label
            name: whatsappCtaLabel
            widget: string
          - label: Services Section Title
            name: introTitle
            widget: string
          - label: Services Section Intro
            name: introBody
            widget: text
          - label: Placement Services
            name: technologies
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { label: "Service Title", name: "title", widget: "string" }
              - { label: "Service Description", name: "desc", widget: "string" }
          - label: Process Section Title
            name: processTitle
            widget: string
          - label: Placement Process Steps
            name: processSteps
            widget: list
            summary: 'Step {{fields.step}}: {{fields.title}}'
            fields:
              - { label: "Step Number", name: "step", widget: "string" }
              - { label: "Step Title", name: "title", widget: "string" }
              - { label: "Step Description", name: "desc", widget: "text" }
          - label: Form Title
            name: formTitle
            widget: string
          - label: Form Subtitle
            name: formSubtitle
            widget: text

  # ─────────────────────────────────────────────────────────────────────────
  # 5. BLOG POSTS
  # ─────────────────────────────────────────────────────────────────────────
  - name: blog
    label: 📝 Blog Posts
    folder: src/content/blog
    create: true
    slug: '{{slug}}'
    media_folder: '../../public/images/blog'
    public_folder: '/images/blog'
    editor:
      preview: false
    fields:
      - label: Article Title
        name: title
        widget: string
        hint: "Full article title shown on the blog listing and detail pages."
      - label: Publish Date
        name: publishDate
        widget: datetime
        format: YYYY-MM-DD
      - label: Author
        name: author
        widget: string
        default: Ask4Trainings Editorial
      - label: Category
        name: category
        widget: select
        options:
          - { label: "Guidewire", value: "Guidewire" }
          - { label: "SAP", value: "SAP" }
          - { label: "Cloud & DevOps", value: "Cloud & DevOps" }
          - { label: "Enterprise IT", value: "Enterprise IT" }
          - { label: "Career Guides", value: "Career Guides" }
      - label: Introduction / Excerpt
        name: description
        widget: text
        hint: "Short summary shown on blog cards and in Google search results."
      - label: Featured Image
        name: image
        widget: image
        required: false
      - label: Article Content
        name: body
        widget: markdown
      - label: Featured Article
        name: featured
        widget: boolean
        default: false
        required: false
        hint: "Enable to pin this article at the top of the blog listing."
      - label: Draft
        name: draft
        widget: boolean
        default: false
        required: false
        hint: "Enable to hide this article from the public site."
