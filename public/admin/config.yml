backend:
  name: github
  repo: rahulabhishek5/ask4trainings
  branch: main
  base_url: https://ask4trainings.pages.dev
  auth_endpoint: /oauth/auth

media_folder: "public/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    media_folder: "../../public/images/blog"
    public_folder: "/images/blog"
    fields:
      - { label: "Article Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "publishDate", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Author", name: "author", widget: "string", default: "Ask4Trainings Editorial" }
      - { label: "Category", name: "category", widget: "select", options: ["Guidewire", "SAP", "Cloud & DevOps", "Enterprise IT", "Career Guides"] }
      - { label: "Introduction / Excerpt", name: "description", widget: "text", hint: "Short summary shown on blog cards and Google search results" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Article Content", name: "body", widget: "markdown" }
      - { label: "Featured Article", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false, required: false }


  # 1. COURSES COLLECTION
  - name: "courses"
    label: "Courses"
    folder: "src/content/courses"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    editor:
      preview: false
    fields:
      - { label: "Course Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", hint: "Lower case, no spaces, hyphens only" }
      - { label: "Category", name: "category", widget: "select", options: ["guidewire", "siemens", "new-courses", "cloud-computing", "oracle", "devops", "development", "ms-d365", "sap", "trending-courses", "other-tools"] }
      - { label: "Menu Short Title", name: "menuTitle", widget: "string", required: false }
      - { label: "Value Proposition", name: "valueProp", widget: "text", required: false }
      
      # 1. Hero Meta
      - { label: "Course Duration", name: "duration", widget: "string", default: "45-60 Hrs" }
      - { label: "Training Mode", name: "mode", widget: "string", default: "Online Live Interactive" }
      - { label: "Ratings & Reviews", name: "rating", widget: "string", default: "4.9/5 (1,200+ Reviews)" }
      - { label: "YouTube Video URL", name: "videoUrl", widget: "string", required: false }
      - { label: "Hero Preview Image", name: "heroImage", widget: "image", required: false }

      # 2. Overview & Brochure
      - { label: "Course Overview", name: "overview", widget: "text", default: "" }
      - { label: "Brochure Google Drive Link", name: "brochureUrl", widget: "string", default: "[https://drive.google.com/](https://drive.google.com/)" }

      # 3. Syllabus Modules
      - label: "Course Syllabus"
        name: "syllabus"
        widget: "list"
        fields:
          - { label: "Module Title", name: "moduleTitle", widget: "string", required: false }
          - { label: "Legacy Module Title", name: "module", widget: "string", required: false }
          - { label: "Topics", name: "topics", widget: "list", field: { label: "Topic", name: "topic", widget: "string" } }

      # 4. About Course
      - { label: "About The Course", name: "aboutCourse", widget: "markdown", default: "", required: false }

      # 5. Objectives
      - { label: "Course Objectives", name: "objectives", widget: "list", field: { label: "Objective", name: "objective", widget: "string" }, required: false }

      # 6. Benefits (3 Containers)
      - label: "Course Benefits"
        name: "benefits"
        widget: "object"
        required: false
        fields:
          - { label: "Basic Knowledge Acquired", name: "basicKnowledge", widget: "list", field: { label: "Point", name: "point", widget: "string" }, required: false }
          - { label: "Technical Skills Gained", name: "techSkills", widget: "list", field: { label: "Point", name: "point", widget: "string" }, required: false }
          - { label: "Career & Industry Opportunities", name: "careerInterests", widget: "list", field: { label: "Point", name: "point", widget: "string" }, required: false }

      # 7. Why Choose
      - label: "Why Choose Ask4Trainings"
        name: "whyChoose"
        widget: "list"
        required: false
        fields:
          - { label: "Feature Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string" }

      # 8. Eligibility
      - { label: "Eligibility Criteria", name: "eligibility", widget: "list", field: { label: "Criteria", name: "criteria", widget: "string" }, required: false }

      # 9. Certifications
      - label: "Certification Details"
        name: "certifications"
        widget: "object"
        required: false
        fields:
          - { label: "Title", name: "title", widget: "string", default: "Industry-Recognized Certification" }
          - { label: "Description", name: "description", widget: "text", default: "Earn verified credentials upon capstone project evaluation and practical lab assessments." }
          - { label: "Recognized Badges / Exams", name: "badges", widget: "list", field: { label: "Badge", name: "badge", widget: "string" }, required: false }

      # 10. Job Roles
      - { label: "Target Job Roles", name: "jobRoles", widget: "list", field: { label: "Role Title", name: "role", widget: "string" }, required: false }

      # 11. Trainer Profile Standards
      - label: "Trainer Excellence Standards"
        name: "trainerProfile"
        widget: "object"
        required: false
        fields:
          - { label: "Heading", name: "heading", widget: "string", default: "Learn from Practicing Enterprise Architects" }
          - { label: "Description", name: "description", widget: "text", default: "Our instructors are active industry leaders and enterprise consultants with a minimum of 10+ years of production experience." }
          - { label: "Key Highlights", name: "highlights", widget: "list", field: { label: "Highlight", name: "highlight", widget: "string" }, required: false }

      # 12. FAQs
      - label: "Frequently Asked Questions"
        name: "faqs"
        widget: "list"
        required: false
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }
          
      # Legacy fields (hidden or optional in editor but kept for schema)
      - { label: "Related Guide Slug", name: "relatedGuideSlug", widget: "string", required: false }
      - label: "SEO Metadata"
        name: "seo"
        widget: "object"
        required: false
        fields:
          - { label: "Meta Title", name: "metaTitle", widget: "string", required: false }
          - { label: "Meta Description", name: "metaDescription", widget: "text", required: false }
      - { label: "Legacy URL", name: "legacyUrl", widget: "string", required: false }
      - { label: "Legacy Impressions", name: "legacyImpressions", widget: "number", required: false }
      - label: "Legacy Highlights"
        name: "highlights"
        widget: "list"
        required: false
        fields:
          - { label: "Icon SVG/Name", name: "icon", widget: "string" }
          - { label: "Text", name: "text", widget: "string" }
      - label: "Legacy Batch Info"
        name: "batchInfo"
        widget: "object"
        required: false
        fields:
          - label: "Format"
            name: "format"
            widget: "select"
            options: ["Online", "Classroom", "Hybrid"]
            required: false
          - { label: "Duration", name: "duration", widget: "string", required: false }
          - { label: "Start Date", name: "startDate", widget: "string", required: false }
          - { label: "Timings", name: "timings", widget: "string", required: false }
      - label: "Prerequisites"
        name: "prerequisites"
        widget: "list"
        required: false
        field: { label: "Prerequisite", name: "prereq", widget: "string" }

  # 2. CATEGORIES HUB
  - name: "categories_collection"
    label: "Categories Hub"
    editor:
      preview: false
    files:
      - label: "Master Categories"
        name: "categories"
        file: "src/data/categories.json"
        format: "json"
        fields:
          - label: "Categories List"
            name: "categories"
            widget: "list"
            fields:
              - { label: "ID/Key", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Icon", name: "icon", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }

  # 3. GLOBAL SITE SETTINGS
  - name: "global_settings"
    label: "Global Settings"
    editor:
      preview: false
    files:
      - label: "Site Settings"
        name: "settings"
        file: "src/data/settings.json"
        format: "json"
        fields:
          - label: "Contact Information"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Phone Primary", name: "phone1", widget: "string" }
              - { label: "Phone Secondary", name: "phone2", widget: "string", required: false }
              - { label: "Address", name: "address", widget: "text" }
              - { label: "Google Maps URL", name: "mapsUrl", widget: "string", required: false }
              - { label: "Operating Hours", name: "hours", widget: "string", required: false }
          - label: "Social Links"
            name: "socials"
            widget: "object"
            fields:
              - { label: "Facebook", name: "facebook", widget: "string", required: false }
              - { label: "X / Twitter", name: "twitter", widget: "string", required: false }
              - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
              - { label: "YouTube", name: "youtube", widget: "string", required: false }
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - label: "Top Banner"
            name: "topBanner"
            widget: "object"
            required: false
            fields:
              - { label: "Text", name: "text", widget: "string" }
              - { label: "Link URL", name: "url", widget: "string", required: false }

      - label: "Navigation"
        name: "navigation"
        file: "src/data/navigation.json"
        format: "json"
        fields:
          - label: "Main Navigation"
            name: "mainNav"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "URL", name: "href", widget: "string" }
          - label: "Footer Quick Links"
            name: "footerLinks"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "URL", name: "href", widget: "string" }
          - { label: "LMS Portal Button Text", name: "lmsButtonText", widget: "string", default: "Student Portal" }

  # 4. STATIC PAGES
  - name: "pages"
    label: "Static Pages"
    editor:
      preview: false
    files:
      - label: "Homepage"
        name: "home"
        file: "src/data/pages/home.json"
        format: "json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Badge Text", name: "badge", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Subheadline", name: "subheadline", widget: "text" }
              - { label: "Primary CTA", name: "primaryCta", widget: "string" }
              - { label: "Secondary CTA", name: "secondaryCta", widget: "string" }
          - label: "Trust Metrics"
            name: "metrics"
            widget: "list"
            fields:
              - { label: "Value", name: "value", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
          - label: "Bento Grid Tiles"
            name: "bento"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Feature Tags"
                name: "tags"
                widget: "list"
                field: { label: "Tag", name: "tag", widget: "string" }
          - label: "Conversion Banner"
            name: "conversion"
            widget: "object"
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Subtext", name: "subtext", widget: "string" }
              
      - label: "About Us Page"
        name: "about"
        file: "src/data/pages/about.json"
        format: "json"
        fields:
          - { label: "Institute Story", name: "story", widget: "text" }
          - label: "Timeline Milestones"
            name: "milestones"
            widget: "list"
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Faculty Highlights"
            name: "faculty"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text" }
          - label: "Infrastructure Points"
            name: "infrastructure"
            widget: "list"
            field: { label: "Point", name: "point", widget: "string" }
            
      - label: "Contact Us Page"
        name: "contact"
        file: "src/data/pages/contact.json"
        format: "json"
        fields:
          - { label: "Support Guidelines", name: "guidelines", widget: "text" }
          - { label: "Form Header", name: "formHeader", widget: "string" }
          - { label: "Form Subtext", name: "formSubtext", widget: "string" }
