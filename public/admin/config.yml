  # ─────────────────────────────────────────────────────────────────────────
  # 5. BLOG POSTS
  # ─────────────────────────────────────────────────────────────────────────
  - name: blog
    label: 📝 Blog Posts
    folder: src/content/blog
    create: true
    slug: '{{slug}}'
    media_folder: '../../public/images/blog'
    public_folder: '/images/blog'
    editor:
      preview: false
    fields:
      - label: Article Title
        name: title
        widget: string
        hint: "Full article title shown on the blog listing and detail pages."
      - label: Publish Date
        name: pubDate
        widget: datetime
        format: YYYY-MM-DD
      - label: Author
        name: author
        widget: string
        default: Ask4Trainings Editorial
      - label: Tags
        name: tags
        widget: list
        hint: "Tags for the blog post."
      - label: Introduction / Excerpt
        name: description
        widget: text
        hint: "Short summary shown on blog cards and in Google search results."
      - label: Featured Image
        name: image
        widget: image
        required: false
      - label: "Article Body (Markdown Content)"
        name: body
        widget: markdown
        hint: "Write your article using Markdown. For Inbound Links (internal pages on this site), use relative paths starting with a slash: [Course Name](/guidewire-policycenter-online-training/). For Outbound Links (external sites), use the full URL: [External Reference](https://example.com)."
      - label: "Call to Action Banner"
        name: cta
        widget: object
        required: false
        fields:
          - label: "Display Dual Action Banner?"
            name: enabled
            widget: boolean
            default: true
            hint: "Turn on to show the 'Enroll Now' and 'WhatsApp Us' action buttons in this article."
          - label: "CTA Banner Heading"
            name: headline
            widget: string
            required: false
            hint: "Callout title. e.g., 'Ready to Master Guidewire?' or 'Need a Live Demo Session? Let’s Connect'"
          - label: "CTA Subtitle / Value Proposition"
            name: subheadline
            widget: string
            required: false
            hint: "Brief 1-sentence prompt. e.g., 'Book your free interactive demo session with industry-certified trainers today.'"
          - label: "Enroll Now Button Link (Inbound Link)"
            name: enrollUrl
            widget: string
            required: false
            hint: "Internal link to the related course page or registration section. Must start with a slash /. e.g., /guidewire-policycenter-online-training/ or /contact-us/"
          - label: "WhatsApp Pre-filled Message"
            name: whatsappMessage
            widget: string
            required: false
            hint: "Custom inquiry text sent when a student taps WhatsApp Us. e.g., 'Hi Ask4Trainings, I read your blog and want to attend a free live demo session.'"
      - label: Draft
        name: draft
        widget: boolean
        default: false
        required: false
        hint: "Enable to hide this article from the public site."

  # ─────────────────────────────────────────────────────────────────────────
  # LEGAL & POLICIES
  # ─────────────────────────────────────────────────────────────────────────
  - name: "legal"
    label: "📜 Terms & Policies"
    folder: "src/content/legal"
    create: false
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Document Name", widget: "string", hint: "Official legal document heading. e.g., Terms & Conditions or Refund Policy" }
      - { name: "lastUpdated", label: "Effective Date", widget: "string", required: false, hint: "Displayed at the top of the policy page. e.g., September 2026 or 2026-09-01" }
      - { name: "description", label: "Description", widget: "string", required: false }
      - { name: "body", label: "Legal Clauses & Terms", widget: "markdown", hint: "Use Markdown formatting (headings with ##, bullet points with -, and bold text with **word**)." }
