backend:
  name: github
  repo: rahulabhishek5/ask4trainings
  branch: main
  base_url: https://ask4trainings.pages.dev
  auth_endpoint: /api/auth

publish_mode: editorial_workflow

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # 1. COURSE CATALOG
  - name: "courses"
    label: "Course Catalog"
    label_singular: "Course"
    folder: "src/content/courses"
    create: true
    format: "yaml-frontmatter"
    extension: "md"
    slug: "{{slug}}"
    summary: "{{title}} ({{category}})"
    sortable_fields: ["title", "category"]
    fields:
      # --- Section 1: Navigation & Metadata ---
      - label: "📍 Live Navigation Breadcrumb"
        name: "navigationPath"
        widget: "string"
        required: false
        hint: "Shows where this page lives in navigation (e.g., 'Navigation Bar > All Courses > GUIDEWIRE > GW Business Analyst')."

      - label: "⭐ Course Priority Tier"
        name: "priorityTier"
        widget: "select"
        required: false
        options:
          - { label: "⭐ Tier 1: High-Priority Flagship", value: "tier-1" }
          - { label: "📈 Tier 2: Growth Program", value: "tier-2" }
          - { label: "🟦 Tier 3: Supporting Course", value: "tier-3" }
        default: "tier-2"
        hint: "Tier 1 courses appear first in Mega Menu and featured catalog carousels."

      - label: "Course Title (H1) *"
        name: "title"
        widget: "string"
        required: true
        hint: "Example: 'Guidewire PolicyCenter 10.x Live Online Training' — Displayed as the primary H1 headline at the top of the course page."

      - label: "URL Slug"
        name: "slug"
        widget: "string"
        required: false
        hint: "The URL path for the course page (e.g., 'guidewire-business-analyst-course'). Leave blank to auto-generate."


      - label: "Course Badge / Short Code"
        name: "badge"
        widget: "string"
        required: false
        hint: "Example: 'GW PC' or 'SAP MM' — Rendered as a compact pill above the course title."

      - label: "Domain Category *"
        name: "category"
        widget: "select"
        required: true
        options:
          - { label: "Guidewire Suite", value: "guidewire" }
          - { label: "SAP Solutions", value: "sap" }
          - { label: "Siemens Teamcenter / PLM", value: "siemens" }
          - { label: "Cloud & DevOps", value: "devops" }
          - { label: "Microsoft Dynamics 365", value: "microsoft-dynamics-365" }
          - { label: "Oracle Cloud", value: "oracle" }
          - { label: "Software Development", value: "development" }
          - { label: "Trending Technologies", value: "trending-courses" }
          - { label: "Other Specialized Tools", value: "other-tools" }
        hint: "Assigns the course to its parent domain in Mega Menu dropdowns and category filters."

      - label: "Course Hero / Thumbnail Image"
        name: "heroImage"
        widget: "image"
        required: false
        hint: "Recommended: 1200x630px WebP or PNG. Used for course card previews and social share cards."

      # --- Section 2: Course Overview & Value Proposition ---
      - label: "Value Proposition / Subheading"
        name: "valueProp"
        widget: "text"
        required: false
        hint: "Example: 'Master Guidewire PolicyCenter architecture, rating engines, and underwriting workflows with hands-on enterprise sandbox labs.' — Appears directly below the H1."

      - label: "Course Overview (Full Description)"
        name: "body"
        widget: "markdown"
        required: false
        hint: "The main body content introducing the course, prerequisites, and learning objectives."

      # --- Section 3: Course Highlights & Key Features ---
      - label: "Key Highlights"
        name: "highlights"
        widget: "list"
        required: false
        hint: "Bulleted takeaway cards (e.g., '60+ Hours Live Interactive Sessions', 'Real-World MNC Project Implementation', '1-on-1 Interview Preparation')."
        field: { label: "Highlight Item", name: "item", widget: "string" }

      # --- Section 4: Syllabus & Curriculum Breakdown ---
      - label: "Curriculum Modules"
        name: "syllabus"
        widget: "list"
        required: false
        hint: "Interactive accordion modules shown in the 'Course Curriculum' section on the page."
        fields:
          - { label: "Module Title", name: "moduleTitle", widget: "string", hint: "Example: 'Module 1: PolicyCenter Architecture & Data Model'" }
          - { label: "Module Duration / Lessons Count", name: "moduleMeta", widget: "string", required: false, hint: "Example: '4 Hours · 6 Lessons'" }
          - label: "Topics Covered"
            name: "topics"
            widget: "list"
            field: { label: "Topic", name: "topic", widget: "string", hint: "Example: 'Product Designer Configuration and Rule Sets'" }

      # --- Section 5: Batch Schedule & Format ---
      - label: "Upcoming Batch Information"
        name: "batchInfo"
        widget: "object"
        required: false
        fields:
          - { label: "Batch Type", name: "type", widget: "select", options: ["Weekend Batch", "Weekday Batch", "Self-Paced / Fast-Track"], default: "Weekend Batch" }
          - { label: "Duration", name: "duration", widget: "string", default: "45-60 Hrs", hint: "Example: '45-60 Hrs' or '8 Weeks'" }
          - { label: "Mode", name: "mode", widget: "string", default: "Live Online + Lab Access" }
          - { label: "Next Batch Date", name: "startDate", widget: "string", hint: "Example: 'Starting This Saturday'" }

      # --- Section 6: Frequently Asked Questions ---
      - label: "Frequently Asked Questions (FAQs)"
        name: "faqs"
        widget: "list"
        required: false
        hint: "Displays inside the FAQ accordion at the bottom of the course page."
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }

      # --- Section 7: SEO, Redirects & Canonical Parity ---
      - label: "SEO Meta Title"
        name: "metaTitle"
        widget: "string"
        required: false
        hint: "Example: 'Guidewire PolicyCenter Training | Live Project Course' — Target: 50-60 characters."

      - label: "SEO Meta Description"
        name: "metaDescription"
        widget: "text"
        required: false
        hint: "Target: 140-160 characters. Displayed in Google Search results snippets."

      - label: "Legacy WordPress URL"
        name: "legacyUrl"
        widget: "string"
        required: false
        hint: "Original URL on ask4trainings.com used for 1:1 SEO redirect preservation."

  # 2. CORE SITE PAGES
  - name: "pages"
    label: "Core Site Pages"
    editor:
      preview: false
    files:
      - label: "Homepage"
        name: "home"
        file: "src/data/pages/home.json"
        format: "json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Badge Text", name: "badge", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Subheadline", name: "subheadline", widget: "text" }
              - { label: "Primary CTA", name: "primaryCta", widget: "string" }
              - { label: "Secondary CTA", name: "secondaryCta", widget: "string" }
          - label: "Trust Metrics"
            name: "metrics"
            widget: "list"
            fields:
              - { label: "Value", name: "value", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
          - label: "Bento Grid Tiles"
            name: "bento"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Feature Tags"
                name: "tags"
                widget: "list"
                field: { label: "Tag", name: "tag", widget: "string" }
          - label: "Conversion Banner"
            name: "conversion"
            widget: "object"
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Subtext", name: "subtext", widget: "string" }
              
      - label: "About Us Page"
        name: "about"
        file: "src/data/pages/about.json"
        format: "json"
        fields:
          - { label: "Institute Story", name: "story", widget: "text" }
          - label: "Timeline Milestones"
            name: "milestones"
            widget: "list"
            fields:
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Faculty Highlights"
            name: "faculty"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text" }
          - label: "Infrastructure Points"
            name: "infrastructure"
            widget: "list"
            field: { label: "Point", name: "point", widget: "string" }
            
      - label: "Contact Us Page"
        name: "contact"
        file: "src/data/pages/contact.json"
        format: "json"
        fields:
          - { label: "Support Guidelines", name: "guidelines", widget: "text" }
          - { label: "Form Header", name: "formHeader", widget: "string" }
          - { label: "Form Subtext", name: "formSubtext", widget: "string" }

      - label: "Student Registration"
        name: "registration"
        file: "src/data/pages/registration.json"
        format: "json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }

  # 3. SERVICES & PROGRAMS
  - name: "services"
    label: "Services & Programs"
    editor:
      preview: false
    files:
      - label: "On-Job Support"
        name: "on_job_support"
        file: "src/data/services/on-job-support.json"
        format: "json"
        fields:
          - { label: "Title", name: "title", widget: "string", default: "On-Job Support" }
          - { label: "Content", name: "content", widget: "text" }
      - label: "Corporate Training"
        name: "corporate_training"
        file: "src/data/services/corporate-training.json"
        format: "json"
        fields:
          - { label: "Title", name: "title", widget: "string", default: "Corporate Training" }
          - { label: "Content", name: "content", widget: "text" }
      - label: "Placement Assistance"
        name: "placement_assistance"
        file: "src/data/services/placement-assistance.json"
        format: "json"
        fields:
          - { label: "Title", name: "title", widget: "string", default: "Placement Assistance" }
          - { label: "Content", name: "content", widget: "text" }

  # 4. GLOBAL SETTINGS & FOOTER
  - name: "global_settings"
    label: "Global Settings & Footer"
    editor:
      preview: false
    files:
      - label: "Announcement Top Banner"
        name: "top_banner"
        file: "src/data/settings/top_banner.json"
        format: "json"
        fields:
          - label: "Top Banner"
            name: "topBanner"
            widget: "object"
            required: false
            fields:
              - { label: "Text", name: "text", widget: "string" }
              - { label: "Link URL", name: "url", widget: "string", required: false }
          - label: "Contact Information"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Phone Primary", name: "phone1", widget: "string" }
              - { label: "Phone Secondary", name: "phone2", widget: "string", required: false }
              - { label: "Address", name: "address", widget: "text" }
              - { label: "Google Maps URL", name: "mapsUrl", widget: "string", required: false }
              - { label: "Operating Hours", name: "hours", widget: "string", required: false }
          - label: "Social Links"
            name: "socials"
            widget: "object"
            fields:
              - { label: "Facebook", name: "facebook", widget: "string", required: false }
              - { label: "X / Twitter", name: "twitter", widget: "string", required: false }
              - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
              - { label: "YouTube", name: "youtube", widget: "string", required: false }
              - { label: "Instagram", name: "instagram", widget: "string", required: false }

      - label: "Header & Mega Menu Navigation"
        name: "navigation"
        file: "src/data/settings/navigation.json"
        format: "json"
        fields:
          - label: "Main Navigation"
            name: "mainNav"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "URL", name: "href", widget: "string" }
          - label: "Footer Quick Links"
            name: "footerLinks"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "URL", name: "href", widget: "string" }
          - { label: "LMS Portal Button Text", name: "lmsButtonText", widget: "string", default: "Student Portal" }

      - label: "Course Category taxonomy"
        name: "categories"
        file: "src/data/settings/categories.json"
        format: "json"
        fields:
          - label: "Categories List"
            name: "categories"
            widget: "list"
            fields:
              - { label: "ID/Key", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Icon", name: "icon", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }

      - label: "Global Enquiry Form settings"
        name: "enquiry_form"
        file: "src/data/settings/enquiry_form.json"
        format: "json"
        fields:
          - { label: "Form Title", name: "title", widget: "string", default: "Enquire Now" }
          - { label: "Success Message", name: "success_message", widget: "string", default: "Thank you for your enquiry!" }

  # 5. BLOG POSTS (Legacy)
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    media_folder: "../../public/images/blog"
    public_folder: "/images/blog"
    fields:
      - { label: "Article Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "publishDate", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Author", name: "author", widget: "string", default: "Ask4Trainings Editorial" }
      - { label: "Category", name: "category", widget: "select", options: ["Guidewire", "SAP", "Cloud & DevOps", "Enterprise IT", "Career Guides"] }
      - { label: "Introduction / Excerpt", name: "description", widget: "text", hint: "Short summary shown on blog cards and Google search results" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Article Content", name: "body", widget: "markdown" }
      - { label: "Featured Article", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false, required: false }
