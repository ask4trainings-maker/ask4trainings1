backend:
  name: github
  repo: rahulabhishek5/ask4trainings
  branch: main
  base_url: https://ask4trainings.pages.dev
  auth_endpoint: /api/auth

publish_mode: editorial_workflow
logo_url: /logo.svg
local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:

  - name: mega_menu
    label: "🧭 Mega Navigation Menu"
    editor:
      preview: false
    files:
      - label: "Mega Navigation"
        name: mega_menu_file
        file: "src/content/settings/mega-menu.json"
        description: "Manage the order and categorization of course links in the main All Courses dropdown."
        format: json
        fields:
          - label: "Category Groups List"
            name: "categories"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "System Category Identifier", name: "key", widget: "string" }
              - { label: "Display Tab Name", name: "label", widget: "string" }
              - { label: "Category Sub-headline", name: "description", widget: "string", required: false }
              - label: "Course Links"
                name: "links"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Link Label", name: "title", widget: "string" }
                  - { label: "Internal URL Path", name: "href", widget: "string", hint: "Must start with / (e.g., /guidewire-policycenter/)" }
                  - { label: "Batch Schedule Pill", name: "duration", widget: "string", required: false, hint: "e.g., 45-60 Hrs · Live Online" }
                  - { label: "Is Popular Course?", name: "isPopular", widget: "boolean", required: false, default: false }

  # ─────────────────────────────────────────────────────────────────────────
  # 1. GLOBAL SETTINGS — settings.json (contact, socials, topBanner)
  # ─────────────────────────────────────────────────────────────────────────
  - name: global_settings
    label: 🌐 Global Settings
    editor:
      preview: false
    files:
      - label: 🚀 Navigation & Top Header
        name: navigation
        file: src/content/settings/navigation.json
        format: json
        fields:
          - label: "Helpline Phone Number"
            name: "phone"
            widget: "string"
            hint: "Displays in the top announcement bar. Format: +91 80999 49888"
          - label: "Official Support Email"
            name: "email"
            widget: "string"
            hint: "Displays in the top bar. Format: ask4trainings@gmail.com"
          - label: "Student Portal Login Address"
            name: "studentPortalUrl"
            widget: "string"
            hint: "External portal URL starting with https:// (e.g., https://portal.ask4trainings.com)"
          - label: "WhatsApp Target Phone Number"
            name: "whatsappNumber"
            widget: "string"
            hint: "Only digits including country code with no + or spaces (e.g., 918099949888)"
          - label: "Enquire Now Default WhatsApp Message"
            name: "enquireMessage"
            widget: "text"
            hint: "Default text pre-filled when a user clicks 'Enquire Now'. Plain text only; the site automatically encodes it for WhatsApp."
      - label: 🦶 Global Footer Settings
        name: footer
        file: src/content/settings/footer.json
        format: json
        fields:
          - label: "About Company (Short Footer Blurb)"
            name: "companySummary"
            widget: "text"
            rows: 3
            hint: "A brief 1 to 2 sentence summary shown under the logo. Keep under 140 characters. e.g., Empowering IT professionals and graduates since 2012 with enterprise cloud training and certification mentorship."
          - label: "Contact Info"
            name: "contactInfo"
            widget: "object"
            fields:
              - { label: "Helpline Phone Number", name: "phone", widget: "string", hint: "Include country code and spaces for clean display. e.g., +91 80999 49888" }
              - { label: "Official Support Email", name: "email", widget: "string", hint: "General inquiry email address. e.g., ask4trainings@gmail.com" }
              - { label: "Physical Center Address", name: "address", widget: "string", hint: "Full street and center address shown in the footer and contact sections. e.g., Plot No 32/27, Door No:402, Deeksha Hospital Building, Nizampet 'X' Road, Hyderabad - 500072" }
          - label: "Popular Courses Links"
            name: "popularCourses"
            widget: "list"
            fields:
              - { label: "Course Display Name", name: "title", widget: "string", hint: "The text visitors see in the footer link list. e.g., Guidewire PolicyCenter Training" }
              - { label: "Course Page Address (URL)", name: "href", widget: "string", hint: "The internal address of the course page. Must start with a slash /. e.g., /guidewire-policycenter-online-training" }
          - label: "Terms & Policies Links"
            name: "termsPoliciesLinks"
            widget: "list"
            fields:
              - { label: "Policy Page Name", name: "title", widget: "string", hint: "Name of the legal page displayed to students. e.g., Refund Policy" }
              - { label: "Policy Page Address (URL)", name: "href", widget: "string", hint: "Internal link starting with a slash /. e.g., /refund-policy or /terms-and-conditions" }
          - label: "Social Media Channels"
            name: "socialLinks"
            widget: "list"
            fields:
              - { label: "Social Media Platform", name: "platform", widget: "select", options: ["YouTube", "LinkedIn", "Instagram", "X (Twitter)", "Facebook"], hint: "Choose which platform icon will display." }
              - { label: "Full Profile Web Address", name: "url", widget: "string", hint: "Copy the complete link directly from your browser bar. Must start with https://. e.g., https://www.youtube.com/@ask4trainings" }
              - { label: "Show on Website?", name: "active", widget: "boolean", default: true, hint: "Turn off to temporarily hide this social link without deleting the URL." }
          - label: "Footer Copyright Line"
            name: "copyright"
            widget: "string"
            hint: "Appears at the very bottom of every page. e.g., © 2026 Ask4Trainings. All rights reserved."

      - label: ⚙️ Site-Wide Settings (Contact, Socials, Banner)
        name: site_settings
        file: src/data/settings.json
        format: json
        fields:
          - label: 📍 Live Location
            name: livePath
            widget: string
            readonly: true
            default: "Sitewide — Header, Footer, Contact Page, Banner"
            required: false
            hint: "READ-ONLY. These values appear across every page."

          - label: 📞 Contact Information
            name: contact
            widget: object
            hint: "Used on the Contact Us page and header. Update carefully."
            fields:
              - label: Support Email
                name: email
                widget: string
                hint: "e.g., ask4trainings@gmail.com"
              - label: Primary Phone
                name: phone1
                widget: string
                hint: "e.g., +91 8099949888 — shown in the header and contact page."
              - label: Office Address
                name: address
                widget: text
                hint: "e.g., Ameerpet, Hyderabad, Telangana, India"
              - label: Office Hours
                name: hours
                widget: string
                hint: "e.g., Mon-Sat 8:00 AM - 8:00 PM"
              - label: Google Maps URL
                name: mapsUrl
                widget: string
                required: false
                hint: "e.g., https://maps.google.com/maps?q=ameerpet"

          - label: 🔗 Social Media Links
            name: socials
            widget: object
            hint: "Social URLs used in the header and contact page. Leave blank to hide that platform."
            fields:
              - label: Facebook URL
                name: facebook
                widget: string
                required: false
                hint: "e.g., https://www.facebook.com/ask4trainings"
              - label: X (Twitter) URL
                name: twitter
                widget: string
                required: false
                hint: "e.g., https://x.com/ask4trainings"
              - label: LinkedIn URL
                name: linkedin
                widget: string
                required: false
                hint: "e.g., https://www.linkedin.com/company/ask4trainings"
              - label: YouTube Channel URL
                name: youtube
                widget: string
                required: false
                hint: "e.g., https://www.youtube.com/@ask4trainings"
              - label: Instagram URL
                name: instagram
                widget: string
                required: false
                hint: "e.g., https://www.instagram.com/ask4trainings"

          - label: 📢 Top Announcement Banner
            name: topBanner
            widget: object
            hint: "The dismissible banner strip shown at the top of every page."
            fields:
              - label: Banner Text
                name: text
                widget: string
                hint: "e.g., 'Guidewire Weekend Batch starting this Saturday! Limited seats.'"

  # ─────────────────────────────────────────────────────────────────────────
  # 2. CORE SITE PAGES
  # ─────────────────────────────────────────────────────────────────────────
  - name: pages
    label: 📄 Core Site Pages
    editor:
      preview: false
    files:

      # ── Homepage (home.json) ───────────────────────────────────────────────
      - label: 🏠 Homepage (/)
        name: home
        file: src/content/pages/home.json
        format: json
        fields:
          - label: 📍 Live Location
            name: livePath
            widget: string
            readonly: true
            default: "Homepage → / (root URL)"
            required: false
            hint: "READ-ONLY. All edits here appear on ask4trainings.com/"

          - label: "── Section 1: Hero Banner ──"
            name: hero
            widget: object
            hint: "The main hero section at the top of the homepage."
            fields:
              - label: Hero Headline (HTML)
                name: headline
                widget: string
                hint: "Main H1 text. HTML allowed. e.g., 'Practical Industry Skills.<br />'"
              - label: Hero Gradient Highlight
                name: headlineGradient
                widget: string
                hint: "The gradient-colored portion of the headline. e.g., 'Accelerate Your Enterprise Career.'"
              - label: Hero Sub-headline
                name: subheadline
                widget: text
                hint: "Supporting text below the H1. 2-3 sentences."
              - label: Primary CTA Button Label
                name: primaryCta
                widget: string
                hint: "e.g., 'Explore Courses'"
              - label: Secondary CTA Button Label
                name: secondaryCta
                widget: string
                hint: "e.g., 'Book Live Demo'"

          - label: "── Section 2: Stats Metrics Row ──"
            name: metrics
            widget: list
            summary: "{{fields.value}} — {{fields.label}}"
            hint: "Numeric credibility metrics shown in the hero stats bar (e.g., 15+ Years, 50k+ Alumni)."
            fields:
              - label: Metric Value
                name: value
                widget: string
                hint: "e.g., '15+' or '50k+'"
              - label: Metric Label
                name: label
                widget: string
                hint: "e.g., 'Years Exp' or 'Alumni'"

          - label: "── Section 3: Why Choose Ask4Trainings Cards ──"
            name: bento
            widget: list
            summary: "{{fields.title}}"
            hint: "4 value proposition cards shown in the 'Why Choose Us' section."
            fields:
              - label: Card Title
                name: title
                widget: string
                hint: "e.g., 'Live Interactive Classes'"
              - label: Card Description
                name: description
                widget: text
                hint: "Short supporting description for this value prop."

          - label: "── Section 4: Learning Roadmap ──"
            name: roadmap
            widget: list
            summary: "{{fields.title}}"
            hint: "4 steps in the learning journey shown on the homepage."
            fields:
              - label: Step Title
                name: title
                widget: string
                hint: "e.g., 'Core Architecture'"
              - label: Step Description
                name: description
                widget: text
                hint: "e.g., 'Master foundational concepts and enterprise frameworks.'"

          - label: "── Section 5: Final CTA Block ──"
            name: conversion
            widget: object
            hint: "The bottom conversion section headline and subtext."
            fields:
              - label: CTA Headline (HTML)
                name: headline
                widget: string
                hint: 'Supports HTML. e.g., "Ready to Upgrade Your <br/><span class="text-primary-light">Career Trajectory?</span>"'
              - label: CTA Sub-text
                name: subtext
                widget: text
                hint: "Supporting paragraph under the CTA headline."

      # ── About Us (about.json) ─────────────────────────────────────────────
      - label: 🏢 About Us (/about-us)
        name: about
        file: src/content/pages/about.json
        format: json
        fields:
          - label: 📍 Live Location
            name: livePath
            widget: string
            readonly: true
            default: "Navigation → About Us → /about-us/"
            required: false
            hint: "READ-ONLY. All edits here appear on ask4trainings.com/about-us/"

          - label: "── Institute Story ──"
            name: story
            widget: text
            hint: "2-4 sentence overview about Ask4Trainings shown at the top of the About page."

          - label: "── Timeline Milestones ──"
            name: milestones
            widget: list
            summary: "{{fields.year}} — {{fields.title}}"
            hint: "Key milestones in the institute's journey (shown as a vertical timeline)."
            fields:
              - label: Year
                name: year
                widget: string
                hint: "e.g., '2018'"
              - label: Milestone Title
                name: title
                widget: string
                hint: "e.g., 'Foundation'"
              - label: Description
                name: description
                widget: text
                hint: "Brief description of what happened in this milestone year."

          - label: "── Expert Faculty Cards ──"
            name: faculty
            widget: list
            summary: "{{fields.name}} — {{fields.role}}"
            hint: "Faculty members shown as profile cards in the Expert Faculty section."
            fields:
              - label: Name
                name: name
                widget: string
                hint: "e.g., 'Senior Architect'"
              - label: Role / Title
                name: role
                widget: string
                hint: "e.g., 'Guidewire Configuration Lead'"
              - label: Bio
                name: bio
                widget: text
                hint: "1-2 sentence bio. e.g., '12+ years of enterprise experience.'"

          - label: "── Lab Infrastructure Checklist ──"
            name: infrastructure
            widget: list
            summary: "{{fields.value}}"
            hint: "Bullet points shown in the Lab Infrastructure section (e.g., 99.9% Uptime Guarantee)."
            field:
              label: Feature
              name: value
              widget: string
              hint: "e.g., 'Zero-setup environments' or '99.9% Uptime Guarantee'"

      # ── Contact Us (contact.json) ────────────────────────────────────────
      - label: 📞 Contact Us (/contact-us)
        name: contact
        file: src/content/pages/contact.json
        format: json
        fields:
          - label: 📍 Live Location
            name: livePath
            widget: string
            readonly: true
            default: "Navigation → Contact Us → /contact-us/"
            required: false
            hint: "READ-ONLY. Edits here affect the enquiry form sidebar on the Contact page."
          - label: "Headline"
            name: "headline"
            widget: "string"
          - label: "Subheadline"
            name: "subheadline"
            widget: "string"
          - label: "Enrollment & Corporate Callout Banner"
            name: "inquiryNotice"
            widget: "text"
            hint: "Prominent notice displayed above the contact form. e.g., For corporate training inquiries, please email us directly. For course enrollment, call our helpline or visit our Ameerpet center."
          - label: "Phone Numbers"
            name: "phoneNumbers"
            widget: "list"
          - label: "Email Addresses"
            name: "emailAddresses"
            widget: "list"
          - label: "Center Address"
            name: "centerAddress"
            widget: "object"
            fields:
              - { label: "Street", name: "street", widget: "string" }
              - { label: "Area", name: "area", widget: "string" }
              - { label: "Pincode", name: "pincode", widget: "string" }
              - { label: "Google Maps Embed Link", name: "mapsLink", widget: "string" }
          - label: "Operating Timings"
            name: "officeHours"
            widget: "string"
            hint: "Days and hours when helpline is active. e.g., Mon - Sat: 8:00 AM - 8:30 PM"
          - label: Enquiry Form Header
            name: formHeader
            widget: string
          - label: Enquiry Form Sub-text
            name: formSubtext
            widget: text

  # ─────────────────────────────────────────────────────────────────────────
  # 3. COURSE PAGES — markdown content in src/content/courses/
  # ─────────────────────────────────────────────────────────────────────────
  - name: courses
    label: 🎓 Edit Course Pages
    folder: src/content/courses
    create: true
    slug: '{{fields.slug}}'
    extension: md
    format: frontmatter
    editor:
      preview: false
    sortable_fields:
      - category
      - priorityTier
      - title
    view_groups:
      - label: By Domain Category
        field: category
      - label: By Priority Tier
        field: priorityTier
    view_filters:
      - label: '⭐ Tier 1: Flagship Courses'
        field: priorityTier
        pattern: tier-1
      - label: '📈 Tier 2: Core Growth'
        field: priorityTier
        pattern: tier-2
      - label: '📘 Tier 3: Specialized'
        field: priorityTier
        pattern: tier-3
      - label: 🛡️ Guidewire & Insurance
        field: category
        pattern: guidewire
      - label: ⚙️ Siemens PLM
        field: category
        pattern: siemens
      - label: 🔷 SAP
        field: category
        pattern: sap
      - label: ☁️ Cloud Computing
        field: category
        pattern: cloud-computing
      - label: 🔧 DevOps
        field: category
        pattern: devops
      - label: 💻 Software Development
        field: category
        pattern: development
      - label: 🌐 Microsoft Dynamics 365
        field: category
        pattern: ms-d365
      - label: 🔶 Oracle & ERP
        field: category
        pattern: oracle
      - label: 🚀 Trending Technologies
        field: category
        pattern: trending-courses
      - label: ✨ New Courses
        field: category
        pattern: new-courses
      - label: 🧰 Other Tools
        field: category
        pattern: other-tools
    fields:
      # ── Navigation & Identity (Top of Page) ──
      - label: "📍 Live Navigation Location"
        name: "navigationLocation"
        widget: "string"
        readonly: true
        required: false
        hint: "Breadcrumb showing where this course appears in site navigation."

      - label: "🌟 Course Promotion Tier"
        name: "priorityTier"
        widget: "select"
        options:
          - { label: "Flagship (Tier 1)", value: "tier-1" }
          - { label: "Core Growth (Tier 2)", value: "tier-2" }
          - { label: "Supporting/Specialized (Tier 3)", value: "tier-3" }
        default: "tier-2"
        hint: "Controls ranking on the catalog homepage."

      - label: "Full Course Title"
        name: "title"
        widget: "string"
        required: true
        hint: "The main name of the course shown on the hero banner. e.g., Guidewire PolicyCenter Online Training"

      - label: "Page Web Address (Slug)"
        name: "slug"
        widget: "string"
        required: true
        pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Must contain only lowercase letters, numbers, and single hyphens without spaces"]
        hint: "The web address for this course. Use lowercase letters and hyphens (e.g., sap-ariba-online-training). Do NOT include domain or slashes."

      - label: "Last Updated"
        name: "updatedDate"
        widget: "datetime"
        required: false
        format: "YYYY-MM-DDTHH:mm:ss.SSS[Z]"
        hint: "Tracks when the course was last updated."

      - label: "Short Acronym / Code"
        name: "badge"
        widget: "string"
        required: false
        hint: "2 to 6 character code used on mobile cards and central icons. e.g., GW PC or D365"

      - label: "Domain Category"
        name: "category"
        widget: "select"
        options:
          - { label: "🛡️ Guidewire Suite", value: "guidewire" }
          - { label: "⚙️ Siemens Teamcenter / PLM", value: "siemens" }
          - { label: "🔷 SAP Solutions", value: "sap" }
          - { label: "☁️ Cloud Computing", value: "cloud-computing" }
          - { label: "🔧 DevOps", value: "devops" }
          - { label: "💻 Software Development", value: "development" }
          - { label: "🌐 Microsoft Dynamics 365", value: "ms-d365" }
          - { label: "🔶 Oracle Cloud & ERP", value: "oracle" }
          - { label: "🚀 Trending Technologies", value: "trending-courses" }
          - { label: "✨ New Courses", value: "new-courses" }
          - { label: "🧰 Other Specialized Tools", value: "other-tools" }
        hint: "Determines which tab this course appears under in the main menu."

      - label: "Course Rating"
        name: "rating"
        widget: "string"
        default: "4.9"
        hint: "Displayed star rating. e.g., '4.9'"

      # ── Hero Section & Schedule ──
      - label: "Course Description Main"
        name: "valueProp"
        widget: "text"
        required: false
        hint: "Lead introductory paragraph displayed below the H1 in the hero section."

      - label: "Hero Graphic Subtitle"
        name: "heroTagline"
        widget: "string"
        required: false
        hint: "One short sentence (under 60 characters) shown inside the dark tech card on the top right. e.g., Core P&C Policy, Billing & Claims Architecture"

      - label: "Course Preview Image (Deprecated)"
        name: "courseImage"
        widget: "image"
        required: false
        hint: "Banners are automatically generated via the dynamic SVG tech canvas. This field is no longer required."

      - label: "Batch & Schedule Information"
        name: "batchInfo"
        widget: "object"
        required: false
        hint: "Batch timing details shown in the hero info chips."
        fields:
          - { label: "Batch Type", name: "type", widget: "string", hint: "e.g., Weekday/Weekend" }
          - { label: "Estimated Completion Time", name: "duration", widget: "string", hint: "Total training hours. e.g., 40-45 Hrs or 6 Weeks" }
          - { label: "Delivery Format", name: "mode", widget: "string", hint: "How classes are conducted. e.g., Online Live Interactive or Weekend Batches" }
          - { label: "Next Cohort Date", name: "startDate", required: false , widget: "string", hint: "e.g., 'Upcoming Monday'" }

      # ── Course Overview (Before Modules) ──
      - label: "Course Overview (1-2 Paragraphs)"
        name: "overview"
        widget: "text"
        required: false
        hint: "Foundational description of the course. Separate multiple paragraphs with a blank line."

      # ── Curriculum Modules Repeater ──
      - label: "📘 Course Curriculum Modules"
        name: "modules"
        widget: "list"
        summary: "Module: {{fields.title}} ({{fields.duration}})"
        hint: "The structured syllabus broken into sequential modules. Each module can have multiple lesson topics."
        fields:
          - { label: "Module Name", name: "title", widget: "string", required: true, hint: "Include the module number and topic name. e.g., Module 1: Mendix Fundamentals" }
          - { label: "Duration", name: "duration", widget: "string", required: false, hint: "e.g., '5 Topics' or '2 Hours'" }
          - label: "Lesson Topics List"
            name: "topics"
            widget: "list"
            summary: "{{fields.topic}}"
            field: { label: "Topic Description", name: "topic", widget: "string", hint: "Add individual bullet points covered in this module. e.g., Introduction to Mendix Studio Basics" }

      # ── Why Master This Course ("About Course" Section) ──
      - label: "🚀 Why Master This Course?"
        name: "whyMaster"
        widget: "object"
        required: false
        hint: "Explains ecosystem demand and enterprise value."
        fields:
          - { label: "Section Headline", name: "title", widget: "string", required: false, hint: "e.g., 'Why Master [Course Title]?'" }
          - { label: "Deep-Dive Syllabus & Training Value", name: "description", widget: "text", required: false, hint: "Detailed course write-up displayed in the Why Master section next to the system architecture diagram." }

      # ── Standalone Key Features Grid ──
      - label: "⚡ Key Features (6 Core Pillars)"
        name: "keyFeatures"
        widget: "list"
        summary: "{{fields.title}}"
        required: false
        hint: "Standalone section that renders all 6 features (Mentor, Project, Curriculum, Career, Certification, Placement) in a clean 6-card responsive grid."
        fields:
          - { label: "Feature Title", name: "title", widget: "string", required: true, hint: "e.g., Mentor, Project, Curriculum, Career, Certification, Placement." }
          - { label: "Feature Description", name: "description", widget: "text", required: true, hint: "Concise takeaway description." }

      # ── Course Benefits ──
      - label: "💡 Course Benefits"
        name: "benefits"
        widget: "list"
        summary: "{{fields.title}}"
        required: false
        hint: "Benefit cards."
        fields:
          - { label: "Benefit Card Title", name: "title", widget: "string", required: true, hint: "e.g., 'Automation Skills', 'Career Growth'" }
          - { label: "Card Lead Description", name: "description", widget: "text", required: true, hint: "Lead description." }
          - label: "Points"
            name: "points"
            widget: "list"
            required: false
            summary: "{{fields.point}}"
            field: { label: "Point", name: "point", widget: "string", hint: "Optional child bullet points for that benefit card." }

      # ── Why Choose This Course ──
      - label: "Market Demand & Career ROI Description"
        name: "whyChooseCourse"
        widget: "text"
        required: false
        hint: "Explain industry hiring demand and enterprise adoption. Shown directly next to the Career ROI Metric Card."

      # ── Career & Market ROI Card ──
      - label: "📊 Career & Market ROI Card"
        name: "roiMetrics"
        widget: "object"
        required: false
        hint: "Domain-specific career metrics. If left blank, automatically falls back to smart defaults based on the course category."
        fields:
          - { label: "Main Headline", name: "headline", widget: "string", required: false, hint: "e.g., 'Enterprise Adoption' or 'Ecosystem Penetration'" }
          - { label: "Pill Badge Text", name: "badge", widget: "string", required: false, hint: "e.g., 'Tier-1 Insurer Demand' or 'Cloud Core Standard'" }
          - label: "Metric 1 (Left Box)"
            name: "metric1"
            widget: "object"
            required: false
            fields:
              - { label: "Highlight Value", name: "value", widget: "string", required: false, hint: "e.g., 'Top 3%', '85%+', 'Tier-1'" }
              - { label: "Metric Label", name: "label", widget: "string", required: false, hint: "e.g., 'Global Insurer Adoption'" }
          - label: "Metric 2 (Right Box)"
            name: "metric2"
            widget: "object"
            required: false
            fields:
              - { label: "Highlight Value", name: "value", widget: "string", required: false, hint: "e.g., '$120K+', 'Global'" }
              - { label: "Metric Label", name: "label", widget: "string", required: false, hint: "e.g., 'Specialist Pay Band'" }
          - { label: "Footer Verification Note", name: "footerNote", widget: "string", required: false, hint: "Verification copy beside the checkmark badge." }

      # ── Eligibility Criteria ("Who Should Enroll?") ──
      - label: "🎯 Who Should Enroll? (Eligibility Profiles)"
        name: "whoShouldEnroll"
        widget: "list"
        summary: "{{fields.title}}"
        required: false
        hint: "Candidate profiles shown in the Eligibility section."
        fields:
          - { label: "Profile Title", name: "title", widget: "string", required: true, hint: "e.g., 'Fresh Graduates', 'Working Professionals'" }
          - { label: "Eligibility Description", name: "description", widget: "text", required: true, hint: "Eligibility description." }

      # ── Course Certification Showcase ──
      - label: "🎓 Course Certification Details"
        name: "certification"
        widget: "object"
        required: false
        hint: "Course certification explanation."
        fields:
          - { label: "Certification Heading", name: "title", widget: "string", required: false, hint: "e.g., 'Industry Recognized Certification'" }
          - { label: "Certification Description", name: "description", widget: "text", required: false, hint: "Multi-paragraph explanation of exam preparation and credential value." }

      # ── Interactive Target Job Roles ──
      - label: "💼 Target Job Positions"
        name: "jobRoles"
        widget: "list"
        summary: "{{fields.role}}"
        required: false
        hint: "Job roles shown in the interactive tab panel after the Eligibility section."
        fields:
          - { label: "Job Title", name: "role", widget: "string", required: true, hint: "Professional position graduates can apply for. e.g., PolicyCenter Developer or Functional Consultant" }
          - { label: "Role Responsibilities", name: "description", widget: "text", required: true, hint: "1 to 2 sentences describing what someone in this job does. e.g., Configures insurance product rules and integrates PolicyCenter with external billing systems." }
          - label: "Key Competencies"
            name: "competencies"
            widget: "list"
            required: false
            summary: "{{fields.skill}}"
            field: { label: "Competency Skill", name: "skill", widget: "string", hint: "Key skill pills associated with the role." }

      # ── Trainer Profile ──
      - label: "👨‍🏫 Trainer Profile"
        name: "trainer"
        widget: "object"
        required: false
        hint: "Trainer biography and enterprise background. Strictly NO image upload widget; visuals are handled by the animated illustration."
        fields:
          - { label: "Trainer Headline", name: "title", widget: "string", required: false, hint: "e.g., 'Expert Led Guidewire Trainer'" }
          - { label: "Trainer Background & Experience", name: "description", widget: "text", required: false, hint: "Trainer biography and enterprise background." }
          - label: "Trainer Highlights"
            name: "highlights"
            widget: "list"
            summary: "{{fields.item}}"
            required: false
            field: { label: "Highlight Bullet", name: "item", widget: "string", hint: "List of bulleted qualifications." }

      # ── FAQs ──
      - label: "❓ Frequently Asked Questions"
        name: "faqs"
        widget: "list"
        summary: "Q: {{fields.question}}"
        required: false
        hint: "FAQ accordion at the bottom of the course page."
        fields:
          - { label: "Student Question", name: "question", widget: "string", required: true, hint: "Common question asked by potential learners. End with a question mark ?. e.g., Are there any prerequisites for this course?" }
          - { label: "Detailed Answer", name: "answer", widget: "text", required: true, hint: "Clear, reassuring response addressing prerequisites, lab access, batch timings, or certifications." }

      # ── SEO & Social Meta (Bottom of Form) ──
      - label: "🔍 Search Engine Optimization (SEO)"
        name: "seo"
        widget: "object"
        required: false
        hint: "Metadata for Google search results. Placed at the bottom of the editor."
        fields:
          - { label: "Google Meta Title", name: "metaTitle", widget: "string", required: false, hint: "Page title tag." }
          - { label: "Google Meta Description", name: "metaDescription", widget: "text", required: false, hint: "Meta description snippet." }

